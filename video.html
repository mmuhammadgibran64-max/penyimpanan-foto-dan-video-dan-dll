<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDEO 7TB - LINK AWAL FIX</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px}
.top{display:flex;justify-content:space-between;background:#000;padding:12px;border-radius:12px}
.logo{background:red;padding:8px 14px;border-radius:10px;font-weight:bold}
.banner{background:#ff4d00;padding:14px;border-radius:12px;margin:15px 0;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#151515;border:1px solid #222;border-radius:12px;overflow:hidden}
.thumb{background:#000;height:130px;display:flex;align-items:center;justify-content:center;position:relative}
.play-btn{background:red;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999}
.modal.show{display:flex}
.modal-box{background:#111;width:95%;max-width:800px;border-radius:12px;overflow:hidden}
video{width:100%;max-height:75vh}
.btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:bold}
.btn-red{background:red;color:#fff}
</style></head><body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">7TB</div><div><div style="font-weight:bold">VIDEO 7TB - LINK AWAL FIX</div><div id="info" style="font-size:11px;color:#888">LINK AWAL 1Miwo_5qEeFKH2MGaqfAghUtYeioHTtmI7PVe7edq7s2U7TKXczLkl1</div></div></div><button class="btn btn-red">PILIH VIDEO NGEBUT</button></div>
<div class="banner">🔥 LINK AWAL 1Miwo_5qEeFKH2MGaqfAghUtYeioHTtmI7PVe7edq7s2U7TKXczLkl1 - AUTHORIZE OK - FIX 0% ANTRI!<br><span id="status" style="font-size:12px;font-weight:normal">VIDEO ONLY - 72.2MB MASUK!</span></div>
<div style="margin-bottom:12px"><button class="btn" style="background:#222;color:#ccc" onclick="loadData()">Refresh</button></div>
<div id="msg" style="display:none;padding:12px;background:#220000;border-radius:8px;margin-bottom:12px"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="modal-box"><div style="padding:12px;background:#000;display:flex;justify-content:space-between"><div id="mtitle">Video</div><button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:28px;height:28px;border-radius:50%">X</button></div><div style="background:#000;min-height:400px;display:flex;align-items:center;justify-content:center;flex-direction:column"><div id="loading">Memuat...</div><video id="vid" controls style="display:none"></video></div><div style="padding:10px;background:#000;display:flex;gap:8px"><button class="btn btn-red" onclick="playVideo()">Preview</button><button class="btn btn-red" onclick="playDirect()">Direct</button><button class="btn" style="background:#222;color:#ccc" onclick="downloadVideo()">Download</button></div></div></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbwP1Ksq2WnIpb4E-gPhmTQMSg2OOIxw_HipwQ07Z1n4Mjm0cJQsZ4GFWnBmTwNT1ioO/exec";
let TOKEN="";let currentId="";
async function loadData(){
  const grid=document.getElementById('grid');const msg=document.getElementById('msg');
  grid.innerHTML='<div style=color:#888>Loading video 7TB...</div>';msg.style.display='none';
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"list"})});
    const t=await r.text();
    if(t.trim().startsWith("<")){msg.style.display='block';msg.innerHTML='❌ GS MASIH PRIVATE! Deploy > Manage deployments > Who has access = Anyone';grid.innerHTML='';return;}
    const data=JSON.parse(t);TOKEN=data.token||"";document.getElementById('info').innerText=data.totalText||data.total+" video";document.getElementById('status').innerText=data.info||"OK";
    grid.innerHTML="";data.files.forEach(f=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="thumb"><div style="position:absolute;top:8px;left:8px;background:red;font-size:10px;padding:3px 8px;border-radius:10px">LINK AWAL</div><div class="play-btn" onclick="openModal('${f.id}','${f.name}')">▶</div><div style="position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.7);font-size:11px;padding:2px 6px;border-radius:6px">${f.size}</div></div><div style="padding:10px"><div style="font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-red" style="flex:1;font-size:11px" onclick="openModal('${f.id}','${f.name}')">Review</button><button class="btn" style="flex:1;background:#222;color:#aaa;font-size:11px" onclick="download('${f.id}')">Download</button></div></div>`;grid.appendChild(el);});
  }catch(e){msg.style.display='block';msg.innerText='Error: '+e.message;}
}
function openModal(id,name){currentId=id;document.getElementById('mtitle').innerText=name;document.getElementById('modal').classList.add('show');playVideo();}
function closeModal(){document.getElementById('modal').classList.remove('show');const v=document.getElementById('vid');v.pause();v.src="";v.style.display="none";document.getElementById('loading').style.display="block";}
async function playVideo(){
  const v=document.getElementById('vid');const l=document.getElementById('loading');l.style.display="block";l.innerText="Memuat...";v.style.display="none";
  try{
    if(!TOKEN){const tr=await fetch(API,{method:"POST",body:JSON.stringify({action:"getToken"})});const td=JSON.parse(await tr.text());TOKEN=td.token;}
    const res=await fetch("https://www.googleapis.com/drive/v3/files/"+currentId+"?alt=media",{headers:{"Authorization":"Bearer "+TOKEN}});
    const blob=await res.blob();v.src=URL.createObjectURL(blob);l.style.display="none";v.style.display="block";v.play();
  }catch(e){l.innerText="Gagal: "+e.message+" - Klik Direct";}
}
function playDirect(){const v=document.getElementById('vid');document.getElementById('loading').style.display="none";v.style.display="block";v.src="https://drive.google.com/uc?export=view&id="+currentId;v.play();}
function download(id){window.open("https://drive.google.com/uc?export=download&id="+id,"_blank");}
function downloadVideo(){download(currentId);}
loadData();
</script></body></html>
