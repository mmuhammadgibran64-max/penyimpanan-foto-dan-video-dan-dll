<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDEO 7TB - FIX TRIPLE REVIEW</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}.top{display:flex;justify-content:space-between;background:#000;padding:12px;border-radius:12px;align-items:center;flex-wrap:wrap;gap:10px}.logo{background:red;padding:8px 14px;border-radius:10px;font-weight:bold}.banner{background:#ff4d00;padding:14px;border-radius:12px;margin:15px 0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.card{background:#151515;border:1px solid #222;border-radius:12px;overflow:hidden}.thumb{background:#000;height:130px;display:flex;align-items:center;justify-content:center;position:relative}.play-btn{background:red;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:9999}.modal.show{display:flex}.modal-box{background:#111;width:95%;max-width:850px;border-radius:12px;overflow:hidden;border:1px solid #333}video,iframe{width:100%;max-height:75vh;background:#000;border:0}.btn{padding:10px 18px;border-radius:20px;border:none;cursor:pointer;font-weight:bold;font-size:12px}.btn-red{background:red;color:#fff}#queue{display:none;background:#fff;color:#000;padding:12px;border-radius:12px;margin-bottom:12px}.bar{height:22px;background:#eee;border-radius:10px;overflow:hidden;margin-top:8px}.bar-inner{height:22px;background:red;width:0%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;transition:width.2s}</style></head><body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">7TB</div><div><div style="font-weight:bold">VIDEO 7TB - FIX TRIPLE & REVIEW</div><div id="info" style="font-size:11px;color:#888">Loading...</div></div></div><label for="fileInput" id="uploadLabel" class="btn btn-red" style="padding:12px 20px;cursor:pointer">📁 PILIH VIDEO NGEBUT</label><input type="file" id="fileInput" multiple accept="video/*" style="position:absolute;left:-9999px"></div>
<div class="banner">🔥 FIX: 1 UPLOAD = 1 VIDEO + REVIEW LANGSUNG PLAY!<br><span id="status" style="font-size:12px;font-weight:normal">Review Fix OK</span></div>
<div id="queue"><div style="display:flex;justify-content:space-between;font-weight:bold"><span id="qtitle">Upload...</span><span id="qcount">0/0</span></div><div class="bar"><div id="qbar" class="bar-inner">0%</div></div><div id="qfile" style="font-size:11px;margin-top:6px"></div><div id="qList" style="font-size:11px;margin-top:8px;max-height:200px;overflow:auto;background:#f5f5f5;padding:8px;border-radius:8px"></div></div>
<div style="margin-bottom:12px"><button class="btn" style="background:#222;color:#ccc" onclick="loadData()">🔄 Refresh</button> <span id="countInfo" style="font-size:11px;color:#888"></span> <button class="btn" style="background:#440000;color:#fff;margin-left:10px" onclick="hapusDuplikat()">🧹 Hapus Duplikat</button></div>
<div id="msg" style="display:none;background:#220000;color:#ff9999;padding:12px;border-radius:8px;margin-bottom:12px"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="modal-box"><div style="padding:12px;background:#000;display:flex;justify-content:space-between"><div id="mtitle" style="font-weight:bold;max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Video</div><button onclick="closeModal()" style="background:#222;color:#fff;border:none;width:32px;height:32px;border-radius:50%">X</button></div><div style="background:#000;min-height:420px;display:flex;align-items:center;justify-content:center;position:relative"><div id="loading" style="color:#888;position:absolute">Memuat video...</div><iframe id="ifr" style="display:none;width:100%;height:70vh" allowfullscreen></iframe><video id="vid" controls playsinline style="display:none;width:100%"></video></div><div style="padding:12px;background:#000;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-red" onclick="playIframe()" style="flex:1">📺 Iframe Preview</button><button class="btn btn-red" onclick="playVideo()" style="flex:1">▶️ Direct Play</button><button class="btn" style="background:#222;color:#fff;flex:1" onclick="downloadVideo()">⬇️ Download</button><button class="btn" style="background:#660000;color:#fff" onclick="hapus()">Hapus</button></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwP1Ksq2WnIpb4E-gPhmTQMSg2OOIxw_HipwQ07Z1n4Mjm0cJQsZ4GFWnBmTwNT1ioO/exec";
const CHUNK=10*1024*1024;
let currentId="", isUploading=false;
function loadData(){
  const grid=document.getElementById('grid'),msg=document.getElementById('msg');
  grid.innerHTML='<div style=color:#888>Loading...</div>'; msg.style.display='none';
  let cb='cb_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{
    if(!d||d.status!="success"){ msg.style.display='block'; msg.innerText='Exec error! Deploy New Version Anyone!'; grid.innerHTML=''; delete window[cb]; s.remove(); return; }
    document.getElementById('info').innerText=d.total+' video • '+d.totalSizeGB+'GB / 7TB • Fix Triple OK';
    document.getElementById('countInfo').innerText=d.total+' video • '+d.totalSizeGB+'GB';
    document.getElementById('status').innerText='✅ '+d.total+' video - 1 upload = 1 file - Review langsung play!';
    grid.innerHTML=''; if(!d.files.length){ grid.innerHTML='<div style=grid-column:1/-1;text-align:center;color:#666;padding:40px;border:1px dashed #333;border-radius:12px">Belum ada video</div>'; delete window[cb]; s.remove(); return; }
    d.files.forEach(f=>{
      let el=document.createElement('div'); el.className='card';
      el.innerHTML=`<div class="thumb"><div style="position:absolute;top:8px;left:8px;background:red;font-size:10px;padding:3px 8px;border-radius:10px">7TB</div><div class="play-btn" onclick="openModal('${f.id}','${f.name.replace(/'/g,"\\'")}')">▶</div><div style="position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.8);font-size:11px;padding:3px 6px;border-radius:6px">${f.sizeMB}</div></div><div style="padding:10px"><div style="font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-red" style="flex:1" onclick="openModal('${f.id}','${f.name.replace(/'/g,"\\'")}')">Review</button><button class="btn" style="flex:1;background:#222;color:#aaa" onclick="download('${f.id}','${f.name}')">Download</button></div></div>`;
      grid.appendChild(el);
    });
    delete window[cb]; s.remove();
  };
  s.src=API+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}
function openModal(id,name){ currentId=id; document.getElementById('mtitle').innerText=name; document.getElementById('modal').classList.add('show'); playIframe(); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); let v=document.getElementById('vid'); v.pause(); v.src=''; v.style.display='none'; document.getElementById('ifr').style.display='none'; document.getElementById('ifr').src=''; document.getElementById('loading').style.display='block'; }
function playIframe(){ let v=document.getElementById('vid'); v.pause(); v.style.display='none'; document.getElementById('loading').style.display='none'; let ifr=document.getElementById('ifr'); ifr.style.display='block'; ifr.src='https://drive.google.com/file/d/'+currentId+'/preview?usp=sharing'; }
function playVideo(){ document.getElementById('ifr').style.display='none'; document.getElementById('loading').style.display='none'; let v=document.getElementById('vid'); v.style.display='block'; v.src='https://drive.google.com/uc?export=download&id='+currentId; v.load(); v.play().catch(()=>{}); }
function download(id,name){ let a=document.createElement('a'); a.href='https://drive.google.com/uc?export=download&id='+id; a.download=name||'video.mp4'; document.body.appendChild(a); a.click(); a.remove(); }
function downloadVideo(){ download(currentId, document.getElementById('mtitle').innerText); }
async function hapus(){ if(!confirm('Hapus video ini?')) return; let fd=new FormData(); fd.append('action','delete'); fd.append('id',currentId); await fetch(API,{method:'POST',body:fd,mode:'no-cors'}); closeModal(); setTimeout(loadData,1000); }
async function hapusDuplikat(){
  if(!confirm('Hapus duplikat VID-20240521-WA0015.mp4? Sisa 1 aja?')) return;
  let cb='cb_dup_'+Date.now(); let s=document.createElement('script');
  window[cb]=async d=>{
    if(!d||!d.files) return;
    let seen={}; let dup=[];
    d.files.forEach(f=>{ let key=f.name+'_'+f.size; if(seen[key]) dup.push(f.id); else seen[key]=true; });
    for(let id of dup){ let fd=new FormData(); fd.append('action','delete'); fd.append('id',id); await fetch(API,{method:'POST',body:fd,mode:'no-cors'}); }
    delete window[cb]; s.remove(); alert('Duplikat dihapus! Sisa '+(d.files.length-dup.length)+' video'); loadData();
  };
  s.src=API+"?callback="+cb+"&action=listAll&t="+Date.now(); document.body.appendChild(s);
}
function getResumableUrl(file){
  return new Promise((res,rej)=>{
    let cb='cb_up_'+Date.now()+Math.random().toString(36).substr(2,5);
    window[cb]=d=>{ delete window[cb]; s.remove(); d&&d.url?res(d.url):rej('Gagal resumable'); };
    let s=document.createElement('script'); s.src=API+"?callback="+cb+"&action=createResumable&filename="+encodeURIComponent(file.name)+"&mimetype="+encodeURIComponent(file.type||'video/mp4')+"&filesize="+file.size+"&t="+Date.now(); document.body.appendChild(s);
  });
}
function setPublic(id){
  return new Promise(r=>{
    let cb='cb_pub_'+Date.now(); let s=document.createElement('script');
    window[cb]=()=>{ delete window[cb]; s.remove(); r(); };
    s.src=API+"?callback="+cb+"&action=setPublic&id="+id+"&t="+Date.now(); document.body.appendChild(s);
    setTimeout(r,2500);
  });
}
document.getElementById('fileInput').addEventListener('change', async e=>{
  if(isUploading){ alert('Masih upload! Tunggu selesai!'); return; }
  let files=[...e.target.files]; if(!files.length) return;
  isUploading=true; document.getElementById('uploadLabel').innerText='⏳ UPLOADING...'; document.getElementById('uploadLabel').style.opacity='0.5';
  let q=document.getElementById('queue'); q.style.display='block'; document.getElementById('qList').innerHTML=''; document.getElementById('qcount').textContent='0/'+files.length;
  for(let idx=0;idx<files.length;idx++){
    let file=files[idx];
    document.getElementById('qcount').textContent=(idx+1)+'/'+files.length;
    document.getElementById('qfile').textContent=(idx+1)+'/'+files.length+': '+file.name+' ('+(file.size/1024/1024).toFixed(1)+'MB)';
    document.getElementById('qbar').style.width='0%'; document.getElementById('qbar').textContent='0%';
    let item=document.createElement('div'); item.textContent='⏳ '+file.name; item.style.padding='4px 0'; document.getElementById('qList').appendChild(item);
    let ok=false,retry=0, uploadUrl=null, fileId=null;
    while(!ok&&retry<2){
      try{
        if(file.size<50*1024*1024){
          let b64=await new Promise((r,j)=>{ let fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.onerror=()=>j('gagal'); fr.readAsDataURL(file); });
          let fd=new FormData(); fd.append('file',b64); fd.append('filename',file.name); fd.append('mimetype',file.type||'video/mp4');
          let resp=await fetch(API,{method:'POST',body:fd}); let txt=await resp.text(); try{ let js=JSON.parse(txt); if(js.id) fileId=js.id; }catch(e){}
          document.getElementById('qbar').style.width='100%'; document.getElementById('qbar').textContent='100%'; item.textContent='✅ '+file.name+' - MASUK 1x!'; ok=true;
        }else{
          if(!uploadUrl) uploadUrl=await getResumableUrl(file);
          let start=0;
          while(start<file.size){
            let end=Math.min(start+CHUNK,file.size); let chunk=file.slice(start,end);
            let resp=await fetch(uploadUrl,{method:'PUT',headers:{"Content-Range":`bytes ${start}-${end-1}/${file.size}`},body:chunk});
            let txt=await resp.text();
            if(txt.includes('"id"')){ try{ let j=JSON.parse(txt); fileId=j.id; }catch(e){} }
            if(!resp.ok&&resp.status!=308&&resp.status!=200&&resp.status!=201) throw new Error('Chunk '+resp.status);
            let pct=Math.round(end/file.size*100); document.getElementById('qbar').style.width=pct+'%'; document.getElementById('qbar').textContent=pct+'%'; start=end;
          }
          if(fileId) await setPublic(fileId);
          item.textContent='✅ '+file.name+' - MASUK 1x PUBLIC!'; ok=true;
        }
      }catch(err){ retry++; item.textContent='⏳ Retry '+retry+': '+err; await new Promise(r=>setTimeout(r,1000)); if(retry>=2) item.textContent='❌ '+file.name+' gagal: '+err; }
    }
  }
  isUploading=false; document.getElementById('uploadLabel').innerText='📁 PILIH VIDEO NGEBUT'; document.getElementById('uploadLabel').style.opacity='1';
  document.getElementById('qtitle').textContent='✅ SELESAI '+files.length+' VIDEO - 1 file = 1 video!';
  setTimeout(()=>{ q.style.display='none'; loadData(); },2000); e.target.value='';
});
loadData();
</script></body></html>
