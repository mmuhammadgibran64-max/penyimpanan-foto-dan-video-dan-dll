<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDEO UNLIMITED - Terpisah 7TB via Script</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{font-family:sans-serif;background:#0f0f0f;color:white}.grid-videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body class="bg-[#0f0f0f]">
<header class="sticky top-0 z-30 bg-black border-b border-white/10 p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-red-600 rounded-xl grid place-items-center font-black text-">VIDEO</div>
<div>
<h1 class="font-black text-sm">VIDEO UNLIMITED - TERPISAH</h1>
<p class="text- text-white/60"><span id="count">0</span> video • <span id="size">0GB / 7TB</span> • Via Script • File Terpisah</p>
<div class="w-56 bg-white/10 h-2 rounded-full mt-1"><div id="storageBar" class="bg-red-600 h-2 rounded-full w-0"></div></div>
</div>
</div>
<div class="flex items-center gap-2">
<input type="file" id="fileInput" multiple hidden accept="video/*">
<button id="btnPick" class="bg-red-600 text-white px-5 py-3 rounded-xl font-bold text-sm">PILIH VIDEO VIA SCRIPT</button>
<a href="dashboard.html" class="bg-white/10 border border-white/20 p-3 rounded-xl" title="Ke Foto"><i data-lucide="image" class="w-4 h-4"></i></a>
<button onclick="load()" class="bg-white/10 border border-white/20 p-3 rounded-xl"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
<button onclick="logout()" class="bg-white/10 border px-3 py-3 rounded-xl font-bold text-">Keluar</button>
</div>
</div>
<div id="queue" class="max-w-7xl mx-auto mt-3 hidden">
<div class="bg-white text-black rounded-2xl p-4 border-2 border-red-500 shadow-2xl">
<div class="flex justify-between"><p id="qtitle" class="font-black text-sm">Upload Video Unlimited via Script...</p><p id="qcounter" class="text- bg-black text-white px-2 py-1 rounded-full">0/0</p></div>
<div class="w-full bg-black/10 h-4 rounded-full mt-3 overflow-hidden"><div id="qbar" class="bg-red-600 h-4 rounded-full w-0 transition-all text- font-bold grid place-items-center text-white"></div></div>
<p id="qfile" class="text- mt-2 truncate font-bold"></p>
<p id="qdetail" class="text- mt-1 text-black/60"></p>
<p id="qstatus" class="text- mt-1 text-red-600 font-bold"></p>
<div id="qList" class="mt-2 max-h-32 overflow-y-auto text- bg-black/5 rounded-xl p-2"></div>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto p-3">
<div class="bg-red-600/20 border border-red-500/30 rounded-2xl p-3 mb-4 flex justify-between items-center">
<p class="text- font-bold">🎬 FILE TERPISAH KHUSUS VIDEO - Unlimited 7TB via Script</p>
<a href="dashboard.html" class="bg-white text-black px-3 py-1 rounded-full text- font-bold">Ke Foto Terpisah →</a>
</div>
<div id="grid" class="grid-videos"></div>
<div id="load" class="py-20 text-center"><p class="text-sm font-bold">Loading Video Unlimited Terpisah...</p><p class="text- text-white/40">Hanya video, foto gak masuk sini</p></div>
</main>

<div id="modal" class="fixed inset-0 z-50 hidden bg-black/90 grid place-items-center p-4"><div class="bg-[#1a1a1a] rounded-2xl max-w-4xl w-full overflow-hidden border border-white/10"><div class="p-3 flex justify-between border-b border-white/10"><p id="modalName" class="font-bold text-sm truncate"></p><button onclick="closeModal()" class="bg-white/10 p-2 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-3"><video id="modalVideo" controls autoplay class="w-full max-h- bg-black rounded-xl"></video><div class="flex gap-2 mt-3"><button onclick="downloadViaScript(currentModalId)" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">Download Video via Script</button><button id="modalDelete" class="bg-white/10 border px-4 py-2 rounded-full text-xs font-bold">Hapus Video</button><a href="dashboard.html" class="bg-white/10 border px-4 py-2 rounded-full text-xs font-bold">Ke Foto</a></div></div></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyirGQC4UpkYWk3QWq39by0QczkNR23uBd5mLFfPYCuuEJtKGfVfFTVwTrD3N-DpV_deA/exec";
const CHUNK=8*1024*1024;
let currentFiles=[]; let currentModalId=null;

function load(){
  document.getElementById('load').classList.remove('hidden'); document.getElementById('grid').innerHTML='';
  let cb='cb_video_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{
    document.getElementById('load').classList.add('hidden');
    if(!d ||!d.files){ document.getElementById('grid').innerHTML='<p class="text-center py-10 text-sm">Gagal load. Cek Drive API ON + Deploy Anyone</p>'; return; }
    let videos=d.files.filter(f=>f.mime && f.mime.includes('video'));
    currentFiles=videos;
    document.getElementById('count').textContent=videos.length;
    let totalSize=videos.reduce((a,b)=>a+b.size,0);
    document.getElementById('size').textContent=(totalSize/1024/1024/1024).toFixed(2)+'GB / 7TB';
    document.getElementById('storageBar').style.width=Math.min((totalSize/(7*1024*1024*1024*1024))*100,100)+'%';
    document.getElementById('grid').innerHTML='';
    if(!videos.length){ document.getElementById('grid').innerHTML='<p class="col-span-full text-center py-10 text-sm text-white/40">Belum ada video bro, upload video dulu via Script - file terpisah khusus video</p>'; return; }
    videos.forEach(f=>{
      let el=document.createElement('div'); el.className='bg-[#1a1a1a] rounded-2xl border border-white/10 overflow-hidden hover:border-red-500/50';
      let thumb=`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;
      el.innerHTML=`<div onclick="openModal('${f.id}')" class="h-40 bg-black grid place-items-center overflow-hidden relative cursor-pointer"><img src="${thumb}" loading="lazy" class="w-full h-full object-cover"><div class="absolute bottom-1 right-1 bg-black/80 text-white text- px-2 py-1 rounded-full">${(f.size/1024/1024).toFixed(1)}MB</div><div class="absolute top-1 left-1 bg-red-600 text-white text- px-2 py-1 rounded-full font-bold">VIDEO TERPISAH</div><div class="absolute inset-0 grid place-items-center"><div class="w-10 h-10 bg-white/20 backdrop-blur rounded-full grid place-items-center"><i data-lucide="play" class="w-5 h-5 fill-white"></i></div></div></div><div class="p-2.5"><p class="text- font-bold truncate">${f.name}</p><p class="text- text-white/40">${f.folder||'Via Script'}</p><div class="flex gap-1 mt-2"><button onclick="downloadViaScript('${f.id}')" class="bg-red-600 text-white text- px-2.5 py-1 rounded-full font-bold">Download</button><button onclick="hapus('${f.id}')" class="bg-white/10 text-white text- px-2.5 py-1 rounded-full font-bold">Hapus</button></div></div>`;
      document.getElementById('grid').appendChild(el);
    });
    delete window[cb]; s.remove(); lucide.createIcons();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}

function openModal(id){ currentModalId=id; let f=currentFiles.find(x=>x.id==id); if(!f) return; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modalName').textContent=f.name; document.getElementById('modalDelete').onclick=()=>{closeModal(); hapus(id);}; document.getElementById('modalVideo').src=`https://drive.google.com/uc?export=view&id=${f.id}`; }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.getElementById('modalVideo').pause(); }
function downloadViaScript(id){ let f=currentFiles.find(x=>x.id==id); if(!f) return; let cb='dl_'+Date.now(); let overlay=document.createElement('div'); overlay.className='fixed inset-0 bg-black/60 z-[60] grid place-items-center p-4'; overlay.innerHTML=`<div class="bg-white text-black rounded-2xl p-5 text-center"><p class="font-bold text-sm">Download ${f.name}...</p></div>`; document.body.appendChild(overlay); window[cb]=d=>{ if(d.status=="success"){ let a=document.createElement('a'); a.href=`data:${d.mime};base64,${d.data}`; a.download=d.name; document.body.appendChild(a); a.click(); a.remove(); } delete window[cb]; s.remove(); overlay.remove(); }; let s=document.createElement('script'); s.src=API_URL+`?callback=${cb}&action=download&id=${id}&t=${Date.now()}`; document.body.appendChild(s); }
async function hapus(id){ if(!confirm('Hapus video ini?')) return; let fd=new FormData(); fd.append('action','delete'); fd.append('id',id); await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'}); setTimeout(load,1200); }
function getResumableUrl(file){ return new Promise((res,rej)=>{ let cb='cb_up_'+Date.now()+Math.random().toString(36).substr(2,5); window[cb]=d=>{ delete window[cb]; s.remove(); if(d && d.url) res(d.url); else rej('Gagal'); }; let s=document.createElement('script'); s.onerror=()=>{ delete window[cb]; s.remove(); rej('Drive API belum ON'); }; s.src=API_URL+`?callback=${cb}&action=createResumable&filename=${encodeURIComponent(file.name)}&mimetype=${encodeURIComponent(file.type||'video/mp4')}&filesize=${file.size}&t=${Date.now()}`; document.body.appendChild(s); }); }
document.getElementById('btnPick').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async e=>{
  let files=[...e.target.files]; if(!files.length) return;
  let queue=document.getElementById('queue'); queue.classList.remove('hidden');
  document.getElementById('qcounter').textContent=`0/${files.length}`; document.getElementById('qList').innerHTML='';
  for(let idx=0; idx<files.length; idx++){
    let file=files[idx];
    if(!file.type.includes('video')){ document.getElementById('qList').innerHTML+=`<div class="py-1 text-red-400">❌ ${file.name} - bukan video, skip!</div>`; continue; }
    document.getElementById('qtitle').textContent=`UPLOAD VIDEO TERPISAH ${idx+1}/${files.length}`;
    document.getElementById('qcounter').textContent=`${idx+1}/${files.length}`;
    document.getElementById('qfile').textContent=`${file.name} (${(file.size/1024/1024).toFixed(1)}MB) -> VIDEO TERPISAH`;
    document.getElementById('qbar').style.width='0%'; document.getElementById('qbar').textContent='0%';
    document.getElementById('qList').innerHTML+=`<div id="item-${idx}" class="py-1">⏳ ${idx+1}. ${file.name} - antri video terpisah...</div>`;
    try{
      if(file.size < 35*1024*1024){
        let b64=await new Promise(r=>{let fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(file);});
        let fd=new FormData(); fd.append('file',b64); fd.append('filename',file.name); fd.append('mimetype',file.type);
        await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
        document.getElementById('qbar').style.width='100%'; document.getElementById('qbar').textContent='100%';
        document.getElementById(`item-${idx}`).innerHTML=`✅ ${idx+1}. ${file.name} - video masuk terpisah!`;
      }else{
        let uploadUrl=await getResumableUrl(file); let start=0;
        while(start<file.size){ let end=Math.min(start+CHUNK,file.size); let chunk=file.slice(start,end); await fetch(uploadUrl,{method:'PUT',headers:{"Content-Range":`bytes ${start}-${end-1}/${file.size}`},body:chunk}); let pct=Math.round((end/file.size)*100); document.getElementById('qbar').style.width=pct+'%'; document.getElementById('qbar').textContent=pct+'%'; document.getElementById('qdetail').textContent=`${pct}% - VIDEO TERPISAH`; start=end; await new Promise(r=>setTimeout(r,300)); }
        document.getElementById(`item-${idx}`).innerHTML=`✅ ${idx+1}. ${file.name} - video gede masuk terpisah!`;
      }
    }catch(err){ document.getElementById(`item-${idx}`).innerHTML=`❌ ${idx+1}. ${file.name} - gagal: ${err}`; }
  }
  document.getElementById('qtitle').textContent=`SELESAI! ${files.length} VIDEO TERPISAH MASUK!`; setTimeout(()=>{queue.classList.add('hidden'); load();},2000); e.target.value='';
});
function logout(){ if(confirm('Keluar? Video tetap aman terpisah')){ localStorage.clear(); location.href='index.html'; } }
load(); lucide.createIcons();
</script>
</body>
</html>
