<!DOCTYPE html>
<html>
<head>
  <title>VIDEO 7TB - LINK AWAL FIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #0e0e0e; color: white; font-family: sans-serif; margin:0; padding:10px; }
    .header { background: #000; padding: 15px; display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #222; }
    .badge { background: #ff1a1a; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
    .banner { background: linear-gradient(90deg, #ff3d00, #ff6a00); padding: 12px 20px; border-radius: 12px; margin: 15px 0; display:flex; justify-content:space-between; align-items:center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 10px; position:relative; overflow:hidden; }
    .card .thumb { background: #000; height: 120px; border-radius: 8px; display:flex; align-items:center; justify-content:center; position:relative; }
    .card .play { background: #ff1a1a; width: 45px; height: 45px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; }
    .btn { padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; margin-right:5px; }
    .btn-review { background: #ff1a1a; color: white; }
    .btn-download { background: #333; color: #aaa; }
    /* MODAL FIX */
    #videoModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 999; align-items:center; justify-content:center; }
    #videoModal.active { display:flex; }
    .modal-box { background: #1c1c1c; width: 90%; max-width: 800px; border-radius: 15px; overflow:hidden; border: 1px solid #333; }
    .modal-header { padding: 12px 15px; background:#111; display:flex; justify-content:space-between; align-items:center; }
    .modal-body { background:#000; min-height: 400px; display:flex; align-items:center; justify-content:center; }
    video { width:100%; max-height: 70vh; background:black; }
    .modal-footer { padding: 10px; background:#111; display:flex; gap:8px; flex-wrap:wrap; }
    .btn-preview { background: #2a5bff; color:white; }
    .btn-direct { background: #ff1a1a; color:white; }
  </style>
</head>
<body>

<div class="header">
  <div style="display:flex; gap:10px; align-items:center;">
    <div style="background:red; padding:8px 12px; border-radius:10px; font-weight:bold;">7TB</div>
    <div>
      <div style="font-weight:bold;">VIDEO 7TB - LINK AWAL FIX</div>
      <div id="infoText" style="font-size:12px; color:#888;">3 video • 0.21GB / 7TB • 1 folder • Link Awal 1Miwo</div>
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn" style="background:#ff1a1a;">📁 PILIH VIDEO NGEBUT</button>
    <button class="btn">📷 FOTO</button>
    <button class="btn">Keluar</button>
  </div>
</div>

<div class="banner">
  <div>
    <div style="font-weight:bold;">🔥 LINK AWAL 1Miwo_5qEe... - AUTHORIZE OK - FIX 0% ANTRI!</div>
    <div id="tokenInfo" style="font-size:12px;">AKfycbwP1Ksq2... exec dari project 1Miwo - Fix Bearer Token - 72.2MB MASUK!</div>
  </div>
  <button class="btn" style="background:white; color:black;">FOTO →</button>
</div>

<div style="margin:10px 0;">
  <button class="btn" style="background:transparent; border:1px solid #555;">Load 1000 Lagi</button>
  <button class="btn btn-review" onclick="loadVideos()">Refresh</button>
</div>

<div class="grid" id="videoGrid">
  <!-- Video akan di-load disini via JS -->
</div>

<!-- MODAL REVIEW FIX -->
<div id="videoModal">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modalTitle">VID-20240521-WA0015.mp4</span>
      <button onclick="closeModal()" style="background:#333; border:none; color:white; width:35px; height:35px; border-radius:50%; cursor:pointer;">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div id="loadingText">Memuat video...</div>
      <video id="mainVideo" controls style="display:none;"></video>
    </div>
    <div class="modal-footer">
      <button class="btn btn-preview" onclick="playVideo()">▶ Preview</button>
      <button class="btn btn-direct" onclick="playDirect()">▶ Direct</button>
      <button class="btn btn-download" onclick="downloadVideo()">Download</button>
      <button class="btn btn-download" onclick="closeModal()">Hapus</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'GANTI_DENGAN_URL_EXEC_GS_LU'; // contoh: https://script.google.com/macros/s/AKfycbwP1Ksq2.../exec
let BEARER_TOKEN = localStorage.getItem('miwo_token') || '';
let currentFileId = '';
let currentFileName = '';

async function getFreshToken(){
  // Ambil token baru dari GS
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({action: 'getToken'})
  });
  const data = await res.json();
  BEARER_TOKEN = data.token;
  localStorage.setItem('miwo_token', BEARER_TOKEN);
  document.getElementById('tokenInfo').innerText = data.token.substring(0,20) + '... exec dari project 1Miwo - Fix Bearer Token - ' + data.size;
  return BEARER_TOKEN;
}

async function loadVideos(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '<div>Loading...</div>';
  
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({action: 'list', token: BEARER_TOKEN})
    });
    const data = await res.json();
    
    document.getElementById('infoText').innerText = `${data.total} video • Link Awal 1Miwo`;
    
    grid.innerHTML = '';
    data.files.forEach(file => {
      grid.innerHTML += `
        <div class="card">
          <div style="position:absolute; top:10px; left:10px; z-index:2;" class="badge">LINK AWAL</div>
          <div class="thumb">
            <div class="play" onclick="openReview('${file.id}', '${file.name}')">▶</div>
            <div style="position:absolute; bottom:5px; right:10px; font-size:12px;">${file.size}</div>
          </div>
          <div style="padding:10px 0 5px; font-weight:bold; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${file.name}</div>
          <div style="font-size:11px; color:#888;">VIDEO 7TB</div>
          <div style="margin-top:8px;">
            <button class="btn btn-review" onclick="openReview('${file.id}', '${file.name}')">▶ Review</button>
            <button class="btn btn-download" onclick="downloadDirect('${file.id}')">Download</button>
          </div>
        </div>
      `;
    });
  } catch(e){
    grid.innerHTML = 'Error: ' + e + '<br>Coba klik Refresh atau cek Deploy GS lu harus Anyone.';
  }
}

function openReview(fileId, fileName){
  currentFileId = fileId;
  currentFileName = fileName;
  document.getElementById('modalTitle').innerText = fileName;
  document.getElementById('videoModal').classList.add('active');
  playVideo(); // langsung play pas dibuka
}

function closeModal(){
  document.getElementById('videoModal').classList.remove('active');
  const v = document.getElementById('mainVideo');
  v.pause();
  v.src = '';
  v.style.display = 'none';
}

// INI KUNCI FIX REVIEW YANG TADI BLANK
async function playVideo(){
  const video = document.getElementById('mainVideo');
  const loading = document.getElementById('loadingText');
  
  loading.style.display = 'block';
  loading.innerText = 'Memuat video 72.2MB...';
  video.style.display = 'none';
  
  try {
    if(!BEARER_TOKEN) await getFreshToken();
    
    // Fetch file sebagai blob pake Bearer Token - ini yang bikin bisa review
    const response = await fetch(`https://www.googleapis.com/drive/v3/files/${currentFileId}?alt=media`, {
      headers: {
        'Authorization': 'Bearer ' + BEARER_TOKEN
      }
    });
    
    if(!response.ok){
      // Token expired, coba refresh sekali lagi
      await getFreshToken();
      return playVideo();
    }
    
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    loading.style.display = 'none';
    video.style.display = 'block';
    video.src = blobUrl;
    video.play();
    
  } catch(err){
    loading.innerText = 'Gagal load: ' + err + '. Coba klik Direct.';
  }
}

function playDirect(){
  // Fallback pake link drive langsung
  const video = document.getElementById('mainVideo');
  document.getElementById('loadingText').style.display = 'none';
  video.style.display = 'block';
  // Ini butuh file di-share Anyone with link
  video.src = `https://drive.google.com/uc?export=view&id=${currentFileId}`;
  video.play();
}

function downloadDirect(fileId){
  window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
}

function downloadVideo(){
  downloadDirect(currentFileId);
}

// Auto load pas buka
loadVideos();
getFreshToken();
</script>
</body>
</html>
