<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlimited Drive V5 - Fixed</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><style>body{font-family:sans-serif;background:#f8fafc}.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}</style><script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script></head><body>
<header class="sticky top-0 z-30 bg-white border-b p-4"><div class="max-w-7xl mx-auto flex justify-between items-center"><div class="flex gap-3 items-center"><div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center text-white"><i data-lucide="hard-drive"></i></div><div><h1 class="font-extrabold">Unlimited Drive V5 Fixed</h1><p class="text-xs text-slate-500"><span id="file-count">0</span> file • <span id="status" class="text-emerald-600 font-bold">Loading...</span></p></div></div><div class="flex gap-2"><input type="file" id="fileInput" multiple hidden><button onclick="fileInput.click()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm">Upload (Tetap Jalan)</button><button onclick="loadFiles()" class="bg-white border p-2.5 rounded-xl"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button></div></div><div id="queue-panel" class="max-w-7xl mx-auto mt-3 hidden"><div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3"><p id="queue-text" class="text-sm font-bold text-indigo-700"></p><div class="bg-white rounded-full h-2 mt-2"><div id="queue-bar" class="bg-indigo-600 h-2 w-0"></div></div></div></div></header>
<main class="max-w-7xl mx-auto p-4"><div id="file-grid" class="grid-files"></div><div id="loading" class="py-20 text-center text-sm text-slate-500">Memuat 319 file...</div></main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbywqzjiQ1SiXUmSxTSsM1xUcM7uvBQs-kDp-y1wv4Zz9TcP6kDcsOaEcudl4Xvxf0-bAg/exec";
let allFiles=[]; let uploadQueue=JSON.parse(localStorage.getItem('unlimited_queue')||'[]'); let isUploading=false;
const fileInput=document.getElementById('fileInput'), grid=document.getElementById('file-grid'), loading=document.getElementById('loading');

function saveQueue(){localStorage.setItem('unlimited_queue',JSON.stringify(uploadQueue));}

function loadFiles(){
  document.getElementById('status').textContent='Loading...'; loading.classList.remove('hidden'); grid.innerHTML='';
  const s=document.createElement('script');
  const cb='cb_'+Date.now();
  window[cb]=function(data){
    try{
      if(data.status==='error') throw new Error(data.message);
      allFiles=data.files||[]; document.getElementById('file-count').textContent=data.total;
      document.getElementById('status').textContent='Connected - '+data.total+' files';
      grid.innerHTML='';
      allFiles.forEach(f=>{
        const thumb=`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;
        const d=document.createElement('div'); d.className='bg-white rounded-2xl border overflow-hidden cursor-pointer hover:shadow';
        d.innerHTML=`<div class="h-40 bg-slate-100"><img src="${thumb}" loading="lazy" class="w-full h-full object-cover"></div><div class="p-2"><p class="text-xs font-bold truncate">${f.name}</p><p class="text- text-slate-400">${(f.size/1024/1024).toFixed(2)} MB</p></div>`;
        d.onclick=()=>{window.open(`https://drive.google.com/uc?export=view&id=${f.id}`,'_blank');};
        grid.appendChild(d);
      });
    }catch(e){ grid.innerHTML=`<p class="text-center text-rose-500">Gagal: ${e.message}</p>`; }
    loading.classList.add('hidden'); delete window[cb]; s.remove();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now();
  s.onerror=function(){ document.getElementById('status').textContent='Failed, coba refresh'; loading.classList.add('hidden'); };
  document.body.appendChild(s);
}

fileInput.addEventListener('change', async(e)=>{
  const files=[...e.target.files]; if(!files.length) return;
  document.getElementById('queue-panel').classList.remove('hidden');
  for(let i=0;i<files.length;i++){
    const file=files[i]; document.getElementById('queue-text').textContent=`Upload ${i+1}/${files.length}: ${file.name} - tetap jalan walau keluar`;
    document.getElementById('queue-bar').style.width=((i/files.length)*100)+'%';
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file);});
    const fd=new FormData(); fd.append('files',b64); fd.append('filenames',file.name); fd.append('mimetypes',file.type);
    await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
    await new Promise(r=>setTimeout(r,800));
  }
  document.getElementById('queue-text').textContent=`Selesai ${files.length} file!`; document.getElementById('queue-bar').style.width='100%';
  setTimeout(()=>{document.getElementById('queue-panel').classList.add('hidden'); loadFiles();},1500);
});

loadFiles(); lucide.createIcons();
</script></body></html>
