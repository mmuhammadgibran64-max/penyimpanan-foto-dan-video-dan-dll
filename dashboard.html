<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlimited Drive - Connected</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc}
.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
</style>
<script>
// Harus login dari index.html dulu
if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}
</script>
</head>
<body class="min-h-screen">
<!-- HEADER -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-100 p-4">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="hard-drive" class="w-5 h-5"></i></div>
<div>
<h1 class="font-extrabold leading-none">Unlimited Drive</h1>
<p class="text-xs text-slate-500"><span id="user-nama">User</span> • <span id="file-count">0 file</span></p>
</div>
</div>
<div class="flex gap-2 items-center">
<input type="file" id="fileInput" multiple hidden accept="*/*">
<button onclick="document.getElementById('fileInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload Banyak</button>
<button onclick="loadFiles()" class="bg-white border border-slate-200 p-2.5 rounded-xl hover:bg-slate-50"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
<!-- BUTTON KELUAR BARU -->
<button onclick="logout()" class="bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 p-2.5 rounded-xl flex items-center gap-2 font-bold text-sm"><i data-lucide="log-out" class="w-5 h-5"></i><span class="hidden md:inline">Keluar</span></button>
</div>
</div>
<!-- Progress -->
<div id="progress-wrap" class="max-w-7xl mx-auto mt-3 hidden">
<div class="bg-slate-200 rounded-full h-2.5 overflow-hidden"><div id="progress-bar" class="bg-indigo-600 h-2.5 w-0 transition-all"></div></div>
<p id="progress-text" class="text-xs font-bold text-indigo-600 mt-1"></p>
</div>
</header>

<main class="max-w-7xl mx-auto p-4">
<div id="file-grid" class="grid-files"></div>
<div id="empty" class="hidden py-20 text-center"><i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-300 mb-3"></i><p class="text-sm text-slate-500">Belum ada file. Upload sekarang bisa pilih 100 foto/video sekaligus</p></div>
<div id="loading" class="py-20 text-center text-sm text-slate-500">Memuat file...</div>
</main>

<!-- MODAL PREVIEW -->
<div id="preview-modal" class="fixed inset-0 bg-black/90 z-50 hidden">
<div class="w-full h-full flex flex-col">
<div class="bg-white px-4 py-3 flex items-center justify-between gap-3 shrink-0">
<div class="min-w-0 flex-1">
<p id="preview-name" class="font-bold text-sm truncate"></p>
<p id="preview-size" class="text-xs text-slate-500"></p>
</div>
<div class="flex items-center gap-2 shrink-0">
<a id="preview-download" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Download</a>
<button id="preview-delete" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2.5 rounded-xl"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
<button onclick="closePreview()" class="bg-slate-100 hover:bg-slate-200 p-2.5 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
</div>
</div>
<div id="preview-content" class="flex-1 flex items-center justify-center p-2 overflow-auto"></div>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxL5BWM_1gIpiC2capsl-fR7ZN1wCoPNlTvbJ90j4ya8gPEYV_KO4rzOzAPndiLDg59PQ/exec";
let allFiles=[];
const fileInput=document.getElementById('fileInput');
const grid=document.getElementById('file-grid');
const loading=document.getElementById('loading');
const empty=document.getElementById('empty');

document.getElementById('user-nama').textContent=localStorage.getItem('presensi_nama')||'Muhammad Gibran';
lucide.createIcons();

async function loadFiles(){
  loading.classList.remove('hidden');
  grid.innerHTML='';
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    allFiles=data.files||[];
    document.getElementById('file-count').textContent=allFiles.length+' file';
    if(allFiles.length===0){empty.classList.remove('hidden');}else{empty.classList.add('hidden');}
    grid.innerHTML='';
    allFiles.forEach(f=>{
      const isImage=f.mimeType.includes('image');
      const isVideo=f.mimeType.includes('video');
      const thumb=`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;
      const div=document.createElement('div');
      div.className='bg-white rounded-2xl border border-slate-100 overflow-hidden cursor-pointer hover:shadow-lg transition-all';
      div.innerHTML=`<div class="h-40 bg-slate-100 flex items-center justify-center overflow-hidden">${isImage?`<img src="${thumb}" loading="lazy" class="w-full h-full object-cover">`:isVideo?`<div class="relative w-full h-full"><img src="${thumb}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/30 grid place-items-center"><i data-lucide="play-circle" class="w-10 h-10 text-white"></i></div></div>`:`<i data-lucide="file" class="w-8 h-8 text-slate-400"></i>`}</div><div class="p-2.5"><p class="font-bold text-xs truncate">${f.name}</p><p class="text- text-slate-400 mt-1">${(f.size/1024/1024).toFixed(2)} MB</p></div>`;
      div.onclick=()=>openPreview(f);
      grid.appendChild(div);
    });
    lucide.createIcons();
  }catch(e){
    grid.innerHTML=`<p class="col-span-full text-center text-rose-500 text-sm">Gagal load. Pastikan Web App sudah deploy Anyone.</p>`;
  }finally{loading.classList.add('hidden');}
}

fileInput.addEventListener('change',async(e)=>{
  const files=[...e.target.files];
  if(!files.length) return;
  const wrap=document.getElementById('progress-wrap');
  const bar=document.getElementById('progress-bar');
  const txt=document.getElementById('progress-text');
  wrap.classList.remove('hidden');
  bar.style.width='0%';
  const fd=new FormData();
  for(let i=0;i<files.length;i++){
    txt.textContent=`Membaca ${i+1}/${files.length}: ${files[i].name}`;
    bar.style.width=Math.round((i/files.length)*50)+'%';
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(files[i]);});
    fd.append('files',b64.split(',')[1]);
    fd.append('filenames',files[i].name);
    fd.append('mimetypes',files[i].type||'application/octet-stream');
  }
  txt.textContent=`Mengupload ${files.length} file ke Drive...`;
  bar.style.width='80%';
  try{
    await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
    bar.style.width='100%';
    txt.textContent=`Berhasil! ${files.length} file terupload`;
    fileInput.value='';
    setTimeout(()=>{wrap.classList.add('hidden');loadFiles();},1500);
  }catch(err){alert('Gagal: '+err);wrap.classList.add('hidden');}
});

function openPreview(f){
  document.getElementById('preview-modal').classList.remove('hidden');
  document.getElementById('preview-name').textContent=f.name;
  document.getElementById('preview-size').textContent=(f.size/1024/1024).toFixed(2)+' MB • '+f.mimeType;
  document.getElementById('preview-download').href=`https://drive.google.com/uc?export=download&id=${f.id}`;
  document.getElementById('preview-delete').onclick=()=>{
    if(confirm('Hapus file '+f.name+'?')){
      const d=new FormData();d.append('action','delete');d.append('id',f.id);
      fetch(API_URL,{method:'POST',body:d,mode:'no-cors'}).then(()=>{closePreview();setTimeout(loadFiles,1000);});
    }
  };
  const c=document.getElementById('preview-content');
  const viewUrl=`https://lh3.googleusercontent.com/d/${f.id}`;
  if(f.mimeType.includes('image')){
    c.innerHTML=`<img src="${viewUrl}" class="max-w-full max-h- object-contain rounded-xl">`;
  }else if(f.mimeType.includes('video')){
    c.innerHTML=`<video src="${viewUrl}" controls autoplay playsinline class="max-w-full max-h- rounded-xl bg-black"></video>`;
  }else if(f.mimeType.includes('audio')){
    c.innerHTML=`<div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center"><i data-lucide="music" class="w-12 h-12 mx-auto text-indigo-600 mb-3"></i><p class="font-bold text-sm mb-3">${f.name}</p><audio src="${viewUrl}" controls autoplay class="w-full"></audio></div>`;
  }else{
    c.innerHTML=`<div class="bg-white rounded-2xl p-8 text-center"><p class="font-bold">${f.name}</p><p class="text-xs text-slate-500 mt-2">Klik Download untuk simpan ke File Manager</p></div>`;
  }
  lucide.createIcons();
}
function closePreview(){document.getElementById('preview-modal').classList.add('hidden');}

// FUNGSI LOGOUT / KELUAR
function logout(){
  if(confirm('Yakin mau keluar? Kamu harus presensi lagi untuk masuk.')){
    localStorage.removeItem('presensi_login');
    localStorage.removeItem('presensi_nama');
    localStorage.removeItem('presensi_hp');
    localStorage.removeItem('presensi_jam');
    window.location.href='index.html';
  }
}

loadFiles();
</script>
</body>
</html>
