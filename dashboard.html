
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DASHBOARD FOTO BALIK AWAL - ADA FOTO LAGI</title>
<style>
body{font-family:Arial;background:#f5f7ff;margin:0}
.header{background:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:10px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;background:#4f46e5;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.card{background:white;border-radius:12px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover}
</style></head><body>
<div class="header"><div><b>📁 FOTO BALIK AWAL - FOTO ADA LAGI</b><br><small id="info">Folder: 19ayHScf247HSyicBp5H3IEkrJa_KhUif - Memuat...</small></div><div><button class="btn" onclick="loadFoto()">🔄 Reload</button></div></div>
<div id="gal" class="grid"></div>
<div id="err" style="text-align:center;padding:40px"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyirGQC4UpkYWk3QWq39by0QczkNR23uBd5mLFfPYCuuEJtKGfVfFTVwTrD3N-DpV_deA/exec';
async function loadFoto(){
 document.getElementById('info').textContent='Memuat foto dari folder awal 19ayHScf... yang ada IMG-20260822...';
 document.getElementById('err').textContent='Loading...';
 try{
  const fd=new FormData(); fd.append('action','list');
  const r=await fetch(API,{method:'POST',body:fd}); const j=await r.json();
  if(j.error){ document.getElementById('err').innerHTML='<b style=color:red>'+j.message+'</b><br><br><a href=https://drive.google.com/drive/folders/19ayHScf247HSyicBp5H3IEkrJa_KhUif target=_blank>Buka Folder di Drive</a><br><br><a href=https://drive.google.com/drive/trash target=_blank>Cek Trash - Restore kalau ada di Trash</a>'; return; }
  document.getElementById('info').textContent=j.totalText + ' - Foto balik lagi!';
  document.getElementById('err').innerHTML='';
  const gal=document.getElementById('gal'); gal.innerHTML='';
  j.files.forEach(f=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML='<img src='+f.thumb+'><div style=padding:8px;font-size:11px><b>'+f.name+'</b><br>'+f.size+'<br><a href='+f.link+' target=_blank>Lihat</a></div>'; gal.appendChild(d); });
 }catch(e){ document.getElementById('err').textContent='Error: '+e.message; }
}
loadFoto();
</script></body></html>
