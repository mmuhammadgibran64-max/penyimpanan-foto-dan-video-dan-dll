<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Drive V13 - Full Fitur 7TB</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{font-family:sans-serif;background:#f8fafc}.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center text-white font-bold">7TB</div><div><h1 class="font-black text-sm">UNLIMITED DRIVE V5 - APP 7TB via SCRIPT</h1><p class="text-"><span id="count">0</span> file • <span id="size">0GB / 7TB</span> • <span id="folders">0 folder</span></p><div class="w-56 bg-slate-200 h-2 rounded-full mt-1"><div id="storageBar" class="bg-indigo-600 h-2 rounded-full w-0"></div></div></div></div>
<div class="flex gap-2"><input type="file" id="fileInput" multiple hidden><button id="btnPick" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-sm">PILIH FILE (1 BYTE - 7TB) VIA SCRIPT</button><button onclick="load()" class="bg-white border p-3 rounded-xl"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button><button onclick="logout()" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-3 rounded-xl font-bold text-xs">Keluar</button></div>
</div>
<div id="queue" class="max-w-7xl mx-auto mt-3 hidden"><div class="bg-slate-900 text-white rounded-2xl p-3"><p id="qtitle" class="font-bold"></p><div class="w-full bg-white/20 h-3 rounded-full mt-2"><div id="qbar" class="bg-emerald-400 h-3 rounded-full w-0"></div></div><p id="qdetail" class="text- mt-2"></p></div></div>
</header>

<main class="max-w-7xl mx-auto p-3">
<div id="grid" class="grid-files"></div>
<div id="load" class="py-20 text-center"><p class="text-sm font-bold">Loading App Storage 7TB via Script...</p><p class="text- text-slate-500">Preview, Download, Hapus semua balik lagi</p></div>
</main>

<!-- MODAL PREVIEW -->
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 grid place-items-center p-4"><div class="bg-white rounded-2xl max-w-3xl w-full overflow-hidden"><div class="p-3 flex justify-between items-center border-b"><p id="modalName" class="font-bold text-sm"></p><button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-3"><img id="modalImg" class="w-full max-h- object-contain rounded-xl bg-slate-100"><div class="flex gap-2 mt-3"><a id="modalDownload" target="_blank" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold">Download</a><button id="modalDelete" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-2 rounded-full text-xs font-bold">Hapus</button></div></div></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbywqzjiQ1SiXUmSxTSsM1xUcM7uvBQs-kDp-y1wv4Zz9TcP6kDcsOaEcudl4Xvxf0-bAg/exec";
const CHUNK=10*1024*1024;
let currentFiles=[];

function load(){
  document.getElementById('load').classList.remove('hidden'); document.getElementById('grid').innerHTML='';
  let cb='cb_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{
    document.getElementById('load').classList.add('hidden');
    document.getElementById('count').textContent=d.total;
    document.getElementById('size').textContent=d.totalSizeGB+'GB / 7TB';
    document.getElementById('folders').textContent=d.folders+' folder app';
    document.getElementById('storageBar').style.width=Math.min((d.totalSize/d.maxBytes)*100,100)+'%';
    currentFiles=d.files;
    d.files.forEach(f=>{
      let el=document.createElement('div'); el.className='bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition cursor-pointer';
      let thumb = f.thumb? f.thumb.replace('=s220',' =w400') : `https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;
      el.innerHTML=`<div onclick="openModal('${f.id}')" class="h-36 bg-slate-100 overflow-hidden"><img src="${thumb}" loading="lazy" class="w-full h-full object-cover"></div><div class="p-2"><p class="text- font-bold truncate">${f.name}</p><p class="text- text-slate-400">${(f.size/1024/1024).toFixed(2)}MB • Via Script</p><div class="flex gap-1 mt-2"><a href="https://drive.google.com/uc?export=download&id=${f.id}" target="_blank" onclick="event.stopPropagation()" class="bg-indigo-50 text-indigo-600 text- px-2 py-1 rounded-full font-bold">Download</a><button onclick="event.stopPropagation(); hapus('${f.id}')" class="bg-rose-50 text-rose-600 text- px-2 py-1 rounded-full font-bold">Hapus</button><button onclick="event.stopPropagation(); openModal('${f.id}')" class="bg-slate-100 text-slate-600 text- px-2 py-1 rounded-full font-bold">Lihat</button></div></div>`;
      document.getElementById('grid').appendChild(el);
    });
    delete window[cb]; s.remove(); lucide.createIcons();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}

function openModal(id){
  let f=currentFiles.find(x=>x.id==id); if(!f) return;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalName').textContent=f.name;
  document.getElementById('modalImg').src=`https://drive.google.com/uc?export=view&id=${f.id}`;
  document.getElementById('modalDownload').href=`https://drive.google.com/uc?export=download&id=${f.id}`;
  document.getElementById('modalDelete').onclick=()=>{closeModal(); hapus(id);};
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

async function hapus(id){
  if(!confirm('Hapus file ini dari App Storage 7TB via Script?')) return;
  let fd=new FormData(); fd.append('action','delete'); fd.append('id',id);
  await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
  setTimeout(load,1000);
}

document.getElementById('btnPick').onclick=()=>document.getElementById('fileInput').click();

document.getElementById('fileInput').addEventListener('change', async e=>{
  let files=[...e.target.files]; if(!files.length) return;
  document.getElementById('queue').classList.remove('hidden');
  for(let file of files){
    document.getElementById('qtitle').textContent=`Upload via SCRIPT ke APP 7TB: ${file.name} ${(file.size/1024/1024).toFixed(1)}MB`;
    if(file.size<40*1024*1024){
      let b64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file);});
      let fd=new FormData(); fd.append('file',b64); fd.append('filename',file.name); fd.append('mimetype',file.type);
      await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
    }else{
      let fd=new FormData(); fd.append('action','createResumable'); fd.append('filename',file.name); fd.append('mimetype',file.type); fd.append('filesize',file.size);
      let res=await fetch(API_URL,{method:'POST',body:fd}); let data=await res.json(); let uploadUrl=data.url;
      let start=0;
      while(start<file.size){
        let end=Math.min(start+CHUNK,file.size);
        let chunk=file.slice(start,end);
        await fetch(uploadUrl,{method:'PUT',headers:{"Content-Range":`bytes ${start}-${end-1}/${file.size}`},body:chunk});
        let pct=Math.round((end/file.size)*100);
        document.getElementById('qbar').style.width=pct+'%';
        document.getElementById('qdetail').textContent=`${pct}% - ${file.name} masuk App Storage 7TB via Script`;
        start=end;
      }
    }
  }
  document.getElementById('qtitle').textContent=`SELESAI! MASUK APP STORAGE 7TB VIA SCRIPT!`;
  setTimeout(()=>{document.getElementById('queue').classList.add('hidden'); document.getElementById('qbar').style.width='0%'; load();},1500);
  e.target.value='';
  // HAPUS CACHE HP BIAR GAK PENUH
  if('caches' in window){ caches.keys().then(names=>names.forEach(n=>caches.delete(n))); }
});

function logout(){ if(confirm('Keluar? File tetap aman di App Storage 7TB via Script')){ localStorage.clear(); location.href='index.html'; } }

load(); lucide.createIcons();

// BERSIHIN INDEXEDDB LAMA YANG BIKIN HP PENUH
(async()=>{ try{ indexedDB.deleteDatabase('UnlimitedV5Fix'); indexedDB.deleteDatabase('UD1400'); indexedDB.deleteDatabase('UnlimitedV8Resume'); indexedDB.deleteDatabase('V9Stable'); indexedDB.deleteDatabase('UnlimitedV8'); localStorage.removeItem('queue'); }catch(e){} })();
</script>
</body>
</html>
