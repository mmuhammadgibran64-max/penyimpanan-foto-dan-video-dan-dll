<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DASHBOARD FOTO BALIK AWAL</title>
<style>
body{font-family:Arial;background:#f5f7ff;margin:0}
.header{background:white;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{padding:10px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.btn-foto{background:#4f46e5;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:8px;font-size:11px}
.error{background:#fee2e2;color:#991b1b;padding:20px;margin:16px;border-radius:12px;text-align:center}
</style></head><body>
<div class="header">
<div><b>📁 FOTO BALIK AWAL - 19ayHScf...</b><br><small id="info">Memuat...</small></div>
<div><button class="btn btn-foto" onclick="loadFoto(true)">🔄 Reload Foto</button> <button class="btn" onclick="clearCache()">Clear Cache</button></div>
</div>
<div id="err"></div>
<div id="gal" class="grid"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyirGQC4UpkYWk3QWq39by0QczkNR23uBd5mLFfPYCuuEJtKGfVfFTVwTrD3N-DpV_deA/exec';
async function loadFoto(force){
 document.getElementById('info').textContent= force?'Force reload...':'Memuat foto dari 19ayHScf247HSyicBp5H3IEkrJa_KhUif...';
 try{
  const fd=new FormData(); fd.append('action','list'); if(force) fd.append('force','1');
  const r=await fetch(API,{method:'POST',body:fd}); const j=await r.json();
  if(j.error){ document.getElementById('err').innerHTML='<div class=error>Gagal: '+j.message+'<br><br>Folder yang dicoba: '+ (j.folderTried||j.folderIdUsed||'19ayHScf247HSyicBp5H3IEkrJa_KhUif') +'<br><br><button onclick=loadFoto(true)>Coba Lagi</button></div>'; return; }
  document.getElementById('err').innerHTML=''; document.getElementById('info').textContent=j.totalText + ' - ' + (j.fromCache?'⚡ CACHE':'✅ DRIVE');
  const gal=document.getElementById('gal'); gal.innerHTML='';
  j.files.forEach(f=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML='<img src='+f.thumb+'><div class=card-body><b>'+f.name+'</b><br>'+f.size+'<br><a href='+f.link+' target=_blank>Lihat</a> | <a href=https://drive.google.com/uc?export=download&id='+f.id+'>Download</a></div>'; gal.appendChild(d); });
 }catch(e){ document.getElementById('err').innerHTML='<div class=error>Error jaringan: '+e.message+'</div>'; }
}
function clearCache(){ localStorage.clear(); fetch(API,{method:'POST',body:new URLSearchParams({action:'clearCache'})}).then(()=>loadFoto(true)); }
loadFoto(false);
</script></body></html
