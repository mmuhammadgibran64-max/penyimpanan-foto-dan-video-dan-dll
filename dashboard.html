<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Drive V5 - APP 7TB via SCRIPT</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{font-family:sans-serif;background:#f8fafc}.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center text-white font-black text-">7TB</div><div><h1 class="font-black text-sm">UNLIMITED DRIVE V5 - APP 7TB via SCRIPT</h1><p class="text-"><span id="count">0</span> file • <span id="size">0GB / 7TB</span> • <span id="folders">0 folder</span> • Via Script</p><div class="w-56 bg-slate-200 h-2 rounded-full mt-1"><div id="storageBar" class="bg-indigo-600 h-2 rounded-full w-0"></div></div></div></div>
<div class="flex items-center gap-2"><input type="file" id="fileInput" multiple hidden><button id="btnPick" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-sm">PILIH FILE VIA SCRIPT</button><button onclick="load()" class="bg-white border p-3 rounded-xl"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button><button onclick="logout()" class="bg-rose-50 text-rose-600 border px-4 py-3 rounded-xl font-bold text-xs">Keluar</button></div>
</div>
<div id="queue" class="max-w-7xl mx-auto mt-3 hidden"><div class="bg-slate-900 text-white rounded-2xl p-3"><p id="qtitle" class="font-bold text-sm"></p><div class="w-full bg-white/20 h-3 rounded-full mt-2"><div id="qbar" class="bg-emerald-400 h-3 rounded-full w-0"></div></div><p id="qdetail" class="text- mt-2"></p></div></div>
</header>
<main class="max-w-7xl mx-auto p-3"><div id="grid" class="grid-files"></div><div id="load" class="py-20 text-center"><p class="text-sm font-bold">Loading App 7TB via Script...</p></div></main>
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 grid place-items-center p-4"><div class="bg-white rounded-2xl max-w-3xl w-full overflow-hidden"><div class="p-3 flex justify-between border-b"><p id="modalName" class="font-bold text-sm"></p><button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-3"><img id="modalImg" class="w-full max-h- object-contain bg-slate-100 rounded-xl hidden"><video id="modalVideo" controls class="w-full max-h- bg-black rounded-xl hidden"></video><div class="flex gap-2 mt-3"><button onclick="downloadViaScript(currentModalId)" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold">Download via Script (Langsung File Manager)</button><button id="modalDelete" class="bg-rose-50 text-rose-600 border px-4 py-2 rounded-full text-xs font-bold">Hapus</button></div></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyirGQC4UpkYWk3QWq39by0QczkNR23uBd5mLFfPYCuuEJtKGfVfFTVwTrD3N-DpV_deA/exec";
const CHUNK=10*1024*1024; let currentFiles=[]; let currentModalId=null;
function load(){
  document.getElementById('load').classList.remove('hidden'); document.getElementById('grid').innerHTML='';
  let cb='cb_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{
    document.getElementById('load').classList.add('hidden');
    if(!d ||!d.files){ document.getElementById('grid').innerHTML='<p class="text-center py-10 text-sm">Gagal. Cek Drive API ON + Deploy Anyone</p>'; return; }
    document.getElementById('count').textContent=d.total; document.getElementById('size').textContent=d.totalSizeGB+'GB / 7TB'; document.getElementById('folders').textContent=d.folders+' folder'; document.getElementById('storageBar').style.width=Math.min((d.totalSize/d.maxBytes)*100,100)+'%';
    currentFiles=d.files;
    d.files.forEach(f=>{
      let el=document.createElement('div'); el.className='bg-white rounded-2xl border overflow-hidden hover:shadow';
      let thumb=`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`; let view=`https://drive.google.com/uc?export=view&id=${f.id}`;
      let isVideo=f.mime && f.mime.includes('video');
      el.innerHTML=`<div onclick="openModal('${f.id}')" class="h-36 bg-slate-100 grid place-items-center overflow-hidden relative"><img src="${thumb}" loading="lazy" onerror="this.src='${view}'" class="w-full h-full object-cover">${isVideo?'<div class="absolute bg-black/70 text-white text- px-2 py-1 rounded-full">VIDEO</div>':''}</div><div class="p-2.5"><p class="text- font-bold truncate">${f.name}</p><p class="text- text-slate-400">${(f.size/1024/1024).toFixed(2)}MB • Via Script</p><div class="flex gap-1 mt-2"><button onclick="downloadViaScript('${f.id}')" class="bg-indigo-600 text-white text- px-2.5 py-1 rounded-full font-bold">Download</button><button onclick="hapus('${f.id}')" class="bg-rose-50 text-rose-600 text- px-2.5 py-1 rounded-full font-bold">Hapus</button><button onclick="openModal('${f.id}')" class="bg-slate-100 text- px-2.5 py-1 rounded-full font-bold">Lihat</button></div></div>`;
      document.getElementById('grid').appendChild(el);
    });
    delete window[cb]; s.remove(); lucide.createIcons();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}
function downloadViaScript(id){
  let f=currentFiles.find(x=>x.id==id); if(!f) return;
  let cb='dl_'+Date.now(); let overlay=document.createElement('div'); overlay.className='fixed inset-0 bg-black/60 z-[60] grid place-items-center p-4'; overlay.innerHTML=`<div class="bg-white rounded-2xl p-5 text-center"><p class="font-bold text-sm">Download via Script...</p><p class="text- text-emerald-600">Langsung File Manager tanpa pilih akun</p></div>`; document.body.appendChild(overlay);
  window[cb]=d=>{ if(d.status=="success"){ let a=document.createElement('a'); a.href=`data:${d.mime};base64,${d.data}`; a.download=d.name; document.body.appendChild(a); a.click(); a.remove(); } delete window[cb]; s.remove(); overlay.remove(); };
  let s=document.createElement('script'); s.src=API_URL+`?callback=${cb}&action=download&id=${id}&t=${Date.now()}`; document.body.appendChild(s);
}
function openModal(id){ currentModalId=id; let f=currentFiles.find(x=>x.id==id); if(!f) return; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modalName').textContent=f.name; document.getElementById('modalDelete').onclick=()=>{closeModal(); hapus(id);}; let isVideo=f.mime && f.mime.includes('video'); if(isVideo){ document.getElementById('modalImg').classList.add('hidden'); let v=document.getElementById('modalVideo'); v.classList.remove('hidden'); v.src=`https://drive.google.com/uc?export=view&id=${f.id}`; } else { document.getElementById('modalVideo').classList.add('hidden'); document.getElementById('modalImg').classList.remove('hidden'); document.getElementById('modalImg').src=`https://drive.google.com/uc?export=view&id=${f.id}`; } }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.getElementById('modalVideo').pause(); }
async function hapus(id){ if(!confirm('Hapus?')) return; let fd=new FormData(); fd.append('action','delete'); fd.append('id',id); await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'}); setTimeout(load,1200); }
function getResumableUrl(file){ return new Promise((res,rej)=>{ let cb='cb_up_'+Date.now(); window[cb]=d=>{ delete window[cb]; s.remove(); if(d && d.url) res(d.url); else rej('Gagal'); }; let s=document.createElement('script'); s.src=API_URL+`?callback=${cb}&action=createResumable&filename=${encodeURIComponent(file.name)}&mimetype=${encodeURIComponent(file.type||'video/mp4')}&filesize=${file.size}&t=${Date.now()}`; document.body.appendChild(s); }); }
document.getElementById('btnPick').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async e=>{
  let files=[...e.target.files]; if(!files.length) return; document.getElementById('queue').classList.remove('hidden');
  for(let file of files){
    document.getElementById('qtitle').textContent=`Upload via SCRIPT: ${file.name}`; document.getElementById('qdetail').textContent=`${(file.size/1024/1024).toFixed(1)}MB - Via Script 7TB`;
    if(file.size<40*1024*1024){ let b64=await new Promise(r=>{let fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(file);}); let fd=new FormData(); fd.append('file',b64); fd.append('filename',file.name); fd.append('mimetype',file.type); await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'}); }
    else{ let url=await getResumableUrl(file); let start=0; while(start<file.size){ let end=Math.min(start+CHUNK,file.size); let chunk=file.slice(start,end); await fetch(url,{method:'PUT',headers:{"Content-Range":`bytes ${start}-${end-1}/${file.size}`},body:chunk}); let pct=Math.round((end/file.size)*100); document.getElementById('qbar').style.width=pct+'%'; document.getElementById('qdetail').textContent=`${pct}% - ${file.name}`; start=end; } }
  }
  document.getElementById('qtitle').textContent=`SELESAI MASUK APP 7TB VIA SCRIPT!`; setTimeout(()=>{document.getElementById('queue').classList.add('hidden'); load();},1500); e.target.value='';
});
function logout(){ if(confirm('Keluar? File tetap aman')){ localStorage.clear(); location.href='index.html'; } }
load(); lucide.createIcons();
</script>
</body>
</html>
