<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Drive V5 - APP 7TB via SCRIPT - Full Fitur</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:sans-serif;background:#f8fafc}
.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
</style>
<script>
if(localStorage.getItem('presensi_login')!=='true'){
  location.href='index.html'
}
</script>
</head>
<body>

<header class="sticky top-0 z-20 bg-white border-b p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center text-white font-black text-">7TB</div>
<div>
<h1 class="font-black text-sm leading-tight">UNLIMITED DRIVE V5 - APP 7TB via SCRIPT</h1>
<p class="text- text-slate-600"><span id="count">0</span> file • <span id="size">0GB / 7TB</span> • <span id="folders">0 folder app</span> • Via Script</p>
<div class="w-56 bg-slate-200 h-2 rounded-full mt-1"><div id="storageBar" class="bg-indigo-600 h-2 rounded-full w-0 transition-all"></div></div>
</div>
</div>
<div class="flex items-center gap-2">
<input type="file" id="fileInput" multiple hidden>
<button id="btnPick" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-sm">PILIH FILE (1 BYTE - 7TB) VIA SCRIPT</button>
<button onclick="load()" class="bg-white border p-3 rounded-xl" title="Refresh"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
<button onclick="logout()" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-3 rounded-xl font-bold text-xs">Keluar</button>
</div>
</div>

<div id="queue" class="max-w-7xl mx-auto mt-3 hidden">
<div class="bg-slate-900 text-white rounded-2xl p-3">
<p id="qtitle" class="font-bold text-sm"></p>
<div class="w-full bg-white/20 h-3 rounded-full mt-2"><div id="qbar" class="bg-emerald-400 h-3 rounded-full w-0 transition-all"></div></div>
<p id="qdetail" class="text- mt-2 text-white/70"></p>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto p-3">
<div id="grid" class="grid-files"></div>
<div id="load" class="py-20 text-center">
<p class="text-sm font-bold">Loading App Storage 7TB via Script...</p>
<p class="text- text-slate-500">Foto bisa dibuka, bisa download, bisa hapus - full fitur balik</p>
</div>
</main>

<!-- MODAL PREVIEW -->
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 grid place-items-center p-4">
<div class="bg-white rounded-2xl max-w-3xl w-full overflow-hidden">
<div class="p-3 flex justify-between items-center border-b">
<p id="modalName" class="font-bold text-sm truncate"></p>
<button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
</div>
<div class="p-3">
<img id="modalImg" class="w-full max-h- object-contain rounded-xl bg-slate-100" src="">
<div class="flex gap-2 mt-3">
<a id="modalDownload" target="_blank" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold">Download</a>
<button id="modalDelete" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-2 rounded-full text-xs font-bold">Hapus</button>
<button onclick="closeModal()" class="bg-slate-100 px-4 py-2 rounded-full text-xs font-bold">Tutup</button>
</div>
</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbywqzjiQ1SiXUmSxTSsM1xUcM7uvBQs-kDp-y1wv4Zz9TcP6kDcsOaEcudl4Xvxf0-bAg/exec";
const CHUNK=10*1024*1024;
let currentFiles=[];

function load(){
  document.getElementById('load').classList.remove('hidden');
  document.getElementById('grid').innerHTML='';
  let cb='cb_'+Date.now();
  let s=document.createElement('script');
  window[cb]=d=>{
    document.getElementById('load').classList.add('hidden');
    document.getElementById('count').textContent=d.total;
    document.getElementById('size').textContent=d.totalSizeGB+'GB / 7TB';
    document.getElementById('folders').textContent=d.folders+' folder app';
    document.getElementById('storageBar').style.width=Math.min((d.totalSize/d.maxBytes)*100,100)+'%';
    currentFiles=d.files;

    if(!d.files.length){
      document.getElementById('grid').innerHTML='<p class="col-span-full text-center text-sm text-slate-400 py-10">Belum ada file</p>';
    }

    d.files.forEach(f=>{
      let el=document.createElement('div');
      el.className='bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition cursor-pointer';

      // FIX PUTIH: pakai thumbnail?id= langsung, bukan thumbnailLink
      let thumbUrl=`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;
      let viewUrl=`https://drive.google.com/uc?export=view&id=${f.id}`;
      let downloadUrl=`https://drive.google.com/uc?export=download&id=${f.id}`;

      el.innerHTML=`
        <div onclick="openModal('${f.id}')" class="h-36 bg-slate-100 overflow-hidden grid place-items-center">
          <img src="${thumbUrl}" loading="lazy" onerror="this.onerror=null; this.src='${viewUrl}'" class="w-full h-full object-cover">
        </div>
        <div class="p-2.5">
          <p class="text- font-bold truncate">${f.name}</p>
          <p class="text- text-slate-400">${(f.size/1024/1024).toFixed(2)}MB • Via Script</p>
          <div class="flex gap-1 mt-2">
            <a href="${downloadUrl}" target="_blank" onclick="event.stopPropagation()" class="bg-indigo-50 text-indigo-600 text- px-2.5 py-1 rounded-full font-bold">Download</a>
            <button onclick="event.stopPropagation(); hapus('${f.id}')" class="bg-rose-50 text-rose-600 text- px-2.5 py-1 rounded-full font-bold">Hapus</button>
            <button onclick="event.stopPropagation(); openModal('${f.id}')" class="bg-slate-100 text-slate-600 text- px-2.5 py-1 rounded-full font-bold">Lihat</button>
          </div>
        </div>
      `;
      document.getElementById('grid').appendChild(el);
    });
    delete window[cb];
    s.remove();
    lucide.createIcons();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now();
  document.body.appendChild(s);
}

function openModal(id){
  let f=currentFiles.find(x=>x.id==id);
  if(!f) return;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalName').textContent=f.name;
  document.getElementById('modalImg').src=`https://drive.google.com/uc?export=view&id=${f.id}`;
  document.getElementById('modalDownload').href=`https://drive.google.com/uc?export=download&id=${f.id}`;
  document.getElementById('modalDelete').onclick=()=>{closeModal(); hapus(id);};
}

function closeModal(){
  document.getElementById('modal').classList.add('hidden');
}

async function hapus(id){
  if(!confirm('Hapus file ini dari App Storage 7TB via Script?')) return;
  let fd=new FormData();
  fd.append('action','delete');
  fd.append('id',id);
  await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
  setTimeout(load,1200);
}

document.getElementById('btnPick').onclick=()=>document.getElementById('fileInput').click();

document.getElementById('fileInput').addEventListener('change', async e=>{
  let files=[...e.target.files];
  if(!files.length) return;
  document.getElementById('queue').classList.remove('hidden');
  document.getElementById('qbar').style.width='0%';

  for(let file of files){
    document.getElementById('qtitle').textContent=`Upload via SCRIPT ke APP 7TB: ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`;
    document.getElementById('qdetail').textContent=`Via Script - Bisa 1 Byte sampai 7TB - Video Foto Berkas Apapun`;

    if(file.size < 40*1024*1024){
      let b64=await new Promise(r=>{let fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(file);});
      let fd=new FormData();
      fd.append('file',b64);
      fd.append('filename',file.name);
      fd.append('mimetype',file.type);
      await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
    }else{
      let fd=new FormData();
      fd.append('action','createResumable');
      fd.append('filename',file.name);
      fd.append('mimetype',file.type);
      fd.append('filesize',file.size);
      let res=await fetch(API_URL,{method:'POST',body:fd});
      let data=await res.json();
      let uploadUrl=data.url;
      let start=0;
      while(start<file.size){
        let end=Math.min(start+CHUNK,file.size);
        let chunk=file.slice(start,end);
        await fetch(uploadUrl,{method:'PUT',headers:{"Content-Range":`bytes ${start}-${end-1}/${file.size}`},body:chunk});
        let pct=Math.round((end/file.size)*100);
        document.getElementById('qbar').style.width=pct+'%';
        document.getElementById('qdetail').textContent=`${pct}% - ${file.name} masuk App Storage 7TB via Script`;
        start=end;
      }
    }
  }
  document.getElementById('qtitle').textContent=`SELESAI! SEMUA MASUK APP STORAGE 7TB VIA SCRIPT!`;
  setTimeout(()=>{
    document.getElementById('queue').classList.add('hidden');
    document.getElementById('qbar').style.width='0%';
    load();
  },1500);
  e.target.value='';
});

function logout(){
  if(confirm('Keluar? File tetap aman di App Storage 7TB via Script')){
    localStorage.clear();
    location.href='index.html';
  }
}

load();
lucide.createIcons();
</script>
</body>
</html>
