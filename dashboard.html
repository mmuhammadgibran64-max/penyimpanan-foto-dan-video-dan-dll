<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Drive V8 Resume</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{font-family:sans-serif;background:#f8fafc}.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-emerald-600 rounded-xl grid place-items-center text-white"><i data-lucide="shield-check"></i></div><div><h1 class="font-extrabold text-sm">V8 Resume - Gak Ngulang Lagi</h1><p class="text-"><span id="count">0</span> file • Anti lag & auto lanjut</p></div></div>
<div class="flex gap-2"><input type="file" id="fileInput" multiple hidden><button id="btnPick" class="bg-emerald-600 text-white px-5 py-3 rounded-xl font-bold text-sm">PILIH FILE (1-1400) - AUTO RESUME</button><button onclick="logout()" class="bg-white border px-3 py-3 rounded-xl text-xs">Keluar</button></div>
</div>
<div id="queue" class="max-w-7xl mx-auto mt-3 hidden">
<div class="bg-slate-900 text-white rounded-2xl p-3">
<div class="flex justify-between items-center"><p id="qtitle" class="font-bold text-sm">0/0</p><p id="qpercent" class="bg-emerald-500 px-3 py-1 rounded-full text-xs font-bold">0%</p></div>
<div class="w-full bg-white/20 h-3 rounded-full mt-2"><div id="qbar" class="bg-emerald-400 h-3 rounded-full w-0"></div></div>
<p id="qdetail" class="text- mt-2 text-white/70">Tutup / restart / back pun aman, nanti lanjut otomatis gak ngulang dari awal</p>
<div class="flex gap-2 mt-2"><button onclick="pauseUpload()" id="btnPause" class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold">Pause</button><button onclick="clearAll()" class="bg-rose-500/80 px-3 py-1 rounded-full text-xs font-bold">Hapus Antrian</button></div>
</div>
</div>
</header>
<main class="max-w-7xl mx-auto p-2"><div id="grid" class="grid-files"></div><div id="load" class="py-10 text-center text-sm">Loading...</div></main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbywqzjiQ1SiXUmSxTSsM1xUcM7uvBQs-kDp-y1wv4Zz9TcP6kDcsOaEcudl4Xvxf0-bAg/exec";
let db, paused=false, uploading=false;

function openDB(){return new Promise(r=>{let req=indexedDB.open('UnlimitedV8Resume',1);req.onupgradeneeded=e=>{let s=e.target.result; if(!s.objectStoreNames.contains('queue')) s.createObjectStore('queue',{keyPath:'id'});};req.onsuccess=e=>{db=e.target.result;r();}});}
function addQ(file){return new Promise(res=>{let t=db.transaction('queue','readwrite');t.objectStore('queue').put({id:Date.now()+Math.random()+'_'+file.name, name:file.name, size:file.size, type:file.type||'application/octet-stream', blob:file, status:'pending'});t.oncomplete=()=>res();});}
function getQ(){return new Promise(res=>{let t=db.transaction('queue','readonly');let r=t.objectStore('queue').getAll();r.onsuccess=()=>res(r.result);});}
function updateStatus(id,status){return new Promise(res=>{let t=db.transaction('queue','readwrite');let store=t.objectStore('queue');let g=store.get(id);g.onsuccess=()=>{let d=g.result; if(d){d.status=status; store.put(d);} };t.oncomplete=()=>res();});}
function delQ(id){return new Promise(res=>{let t=db.transaction('queue','readwrite');t.objectStore('queue').delete(id);t.oncomplete=()=>res();});}
function clearDB(){return new Promise(res=>{let t=db.transaction('queue','readwrite');t.objectStore('queue').clear();t.oncomplete=()=>res();});}

function load(){
  document.getElementById('load').classList.remove('hidden');
  let cb='cb_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{document.getElementById('load').classList.add('hidden'); document.getElementById('count').textContent=d.total; document.getElementById('grid').innerHTML=''; d.files.forEach(f=>{let el=document.createElement('div'); el.className='bg-white rounded-xl border overflow-hidden'; el.innerHTML=`<div class="h-32 bg-slate-100"><img src="https://drive.google.com/thumbnail?id=${f.id}&sz=w400" loading="lazy" class="w-full h-full object-cover"></div><div class="p-2"><p class="text- font-bold truncate">${f.name}</p></div>`; document.getElementById('grid').appendChild(el);}); delete window[cb]; s.remove();};
  s.src=API_URL+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}

document.getElementById('btnPick').onclick=()=>document.getElementById('fileInput').click();

document.getElementById('fileInput').addEventListener('change', async e=>{
  let files=[...e.target.files]; if(!files.length) return;
  await openDB();
  document.getElementById('queue').classList.remove('hidden');
  document.getElementById('qtitle').textContent=`Menyimpan ${files.length} file... sebentar`;

  // Simpan cepet tanpa bikin lag - pakai batch
  for(let f of files) await addQ(f);
  e.target.value='';
  startResumeUpload();
});

async function uploadOne(item){
  if(paused) return false;
  await updateStatus(item.id,'uploading');
  document.getElementById('qdetail').textContent=`Upload: ${item.name} (${(item.size/1024/1024).toFixed(1)}MB)`;

  // ANTI LAG: baca file pelan2 pakai FileReader tanpa nge-freeze HP
  let b64=await new Promise(r=>{
    let fr=new FileReader();
    fr.onload=()=>r(fr.result.split(',')[1]);
    fr.onerror=()=>r(null);
    fr.readAsDataURL(item.blob);
  });
  if(!b64) return false;

  let fd=new FormData(); fd.append('file',b64); fd.append('filename',item.name); fd.append('mimetype',item.type);
  try{
    await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
    await delQ(item.id);
    return true;
  }catch(err){ await updateStatus(item.id,'pending'); return false; }
}

async function startResumeUpload(){
  if(uploading) return; uploading=true; paused=false;
  await openDB();
  let q=await getQ();
  if(!q.length){document.getElementById('queue').classList.add('hidden'); uploading=false; return;}

  let pending=q.filter(x=>x.status!=='done');
  let total=q.length; let initialDone=total-pending.length;

  document.getElementById('queue').classList.remove('hidden');
  let done=initialDone;

  // UPLOAD 2 FILE BARENGAN AJA BIAR GAK LAG
  let concurrent=2; let idx=0;

  async function worker(){
    while(idx<pending.length &&!paused){
      let item=pending[idx++];
      let ok=await uploadOne(item);
      if(ok){ done++; }
      let pct=Math.round((done/total)*100);
      document.getElementById('qbar').style.width=pct+'%';
      document.getElementById('qpercent').textContent=pct+'%';
      document.getElementById('qtitle').textContent=`${done}/${total} file masuk Unlimited Drive`;
      if(done===total){ document.getElementById('qtitle').textContent=`SELESAI ${total} FILE!`; setTimeout(()=>{document.getElementById('queue').classList.add('hidden'); load(); uploading=false;},1500); return; }
    }
  }

  let workers=[]; for(let i=0;i<concurrent;i++) workers.push(worker());
  await Promise.all(workers);
  uploading=false;
  if(!paused) load();
}

function pauseUpload(){ paused=true; document.getElementById('qdetail').textContent='Di-pause. Klik Pilih File lagi untuk lanjut.'; document.getElementById('btnPause').textContent='Paused'; }
async function clearAll(){ if(!confirm('Hapus semua antrian?')) return; await openDB(); await clearDB(); document.getElementById('queue').classList.add('hidden'); }

function logout(){localStorage.clear();location.href='index.html';}

// AUTO RESUME PAS BUKA DASHBOARD
(async()=>{await openDB(); load(); let q=await getQ(); if(q.length){ document.getElementById('queue').classList.remove('hidden'); startResumeUpload(); }})();
lucide.createIcons();

// Anti lag: jangan reload kalau lagi upload
window.addEventListener('beforeunload', e=>{
  if(uploading){ e.preventDefault(); e.returnValue='Upload masih jalan, yakin mau keluar? Nanti lanjut otomatis kok.'; }
});
</script>
</body>
</html>
