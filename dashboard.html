<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Drive V5 - 1400 Files Direct</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{font-family:sans-serif;background:#f8fafc}.grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center text-white"><i data-lucide="hard-drive"></i></div><div><h1 class="font-extrabold text-sm">Unlimited Drive V5 - 1400 Direct</h1><p class="text-"><span id="count">0</span> file • <span id="stat" class="text-emerald-600 font-bold">Siap terima 1400 file langsung</span></p></div></div>
<div class="flex gap-2"><input type="file" id="fileInput" multiple hidden><button onclick="document.getElementById('fileInput').click()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs">KLIK DISINI - PILIH 1400 FILE LANGSUNG</button><button onclick="logout()" class="bg-white border px-3 py-2.5 rounded-xl text-xs font-bold">Keluar</button></div>
</div>
<div id="queue" class="max-w-7xl mx-auto mt-3 hidden"><div class="bg-indigo-600 text-white rounded-2xl p-4"><p id="qtitle" class="font-extrabold"></p><div class="w-full bg-white/30 h-3 rounded-full mt-2"><div id="qbar" class="bg-white h-3 rounded-full w-0"></div></div><p id="qdetail" class="text- mt-2"></p><div id="qlist" class="mt-2 max-h-24 overflow-auto bg-black/20 rounded-xl p-2 text-"></div></div></div>
</header>
<main class="max-w-7xl mx-auto p-3"><div id="grid" class="grid-files"></div><div id="load" class="py-20 text-center text-sm">Loading...</div></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbywqzjiQ1SiXUmSxTSsM1xUcM7uvBQs-kDp-y1wv4Zz9TcP6kDcsOaEcudl4Xvxf0-bAg/exec";
let db; let totalFiles=0, doneFiles=0;
function openDB(){return new Promise(r=>{let req=indexedDB.open('UD1400',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('q',{keyPath:'id'});req.onsuccess=e=>{db=e.target.result;r();}});}
function addQ(f){return new Promise(r=>{let t=db.transaction('q','readwrite');t.objectStore('q').put({id:Date.now()+Math.random(),name:f.name,size:f.size,type:f.type,blob:f});t.oncomplete=()=>r();});}
function getQ(){return new Promise(r=>{let t=db.transaction('q','readonly');let q=t.objectStore('q').getAll();q.onsuccess=()=>r(q.result);});}
function delQ(id){return new Promise(r=>{let t=db.transaction('q','readwrite');t.objectStore('q').delete(id);t.oncomplete=()=>r();});}

function load(){
  document.getElementById('load').classList.remove('hidden');
  let cb='cb_'+Date.now(); let s=document.createElement('script');
  window[cb]=d=>{
    document.getElementById('load').classList.add('hidden');
    document.getElementById('count').textContent=d.total;
    document.getElementById('grid').innerHTML='';
    d.files.forEach(f=>{
      let el=document.createElement('div'); el.className='bg-white rounded-xl border overflow-hidden';
      el.innerHTML=`<div class="h-32 bg-slate-100"><img src="https://drive.google.com/thumbnail?id=${f.id}&sz=w400" class="w-full h-full object-cover"></div><div class="p-2"><p class="text- font-bold truncate">${f.name}</p></div>`;
      document.getElementById('grid').appendChild(el);
    });
    delete window[cb]; s.remove();
  };
  s.src=API_URL+"?callback="+cb+"&t="+Date.now(); document.body.appendChild(s);
}

// PILIH 1400 LANGSUNG - PARALEL 5 FILE
document.getElementById('fileInput').addEventListener('change',async e=>{
  let files=[...e.target.files]; if(!files.length) return;
  await openDB();
  document.getElementById('queue').classList.remove('hidden');
  document.getElementById('qtitle').textContent=`Menyimpan ${files.length} file ke antrian...`;
  for(let f of files) await addQ(f);
  e.target.value='';
  totalFiles=files.length; doneFiles=0;
  startParallel();
});

async function uploadOne(item){
  let b64=await new Promise(r=>{let fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(item.blob);});
  let fd=new FormData(); fd.append('file',b64); fd.append('filename',item.name); fd.append('mimetype',item.type);
  await fetch(API_URL,{method:'POST',body:fd,mode:'no-cors'});
  await delQ(item.id);
  doneFiles++;
  document.getElementById('qbar').style.width=((doneFiles/totalFiles)*100)+'%';
  document.getElementById('qtitle').textContent=`Upload via SCRIPT ${doneFiles}/${totalFiles} selesai - Sisa ${totalFiles-doneFiles}`;
  document.getElementById('qdetail').textContent=`Berhasil: ${item.name}`;
  document.getElementById('qlist').innerHTML+=`<div>✅ ${item.name}</div>`;
  if(doneFiles===totalFiles){ document.getElementById('qtitle').textContent=`SELESAI! ${totalFiles} FILE LANGSUNG MASUK UNLIMITED DRIVE!`; setTimeout(()=>{document.getElementById('queue').classList.add('hidden'); load();},2000); }
}

async function startParallel(){
  let q=await getQ();
  let concurrent=5; // UPLOAD 5 FILE BARENGAN BIAR KENCENG
  let running=0, idx=0;
  function next(){
    if(idx>=q.length && running===0) return;
    while(running<concurrent && idx<q.length){
      running++; let item=q[idx++];
      uploadOne(item).finally(()=>{running--; next();});
    }
  }
  next();
}

function logout(){localStorage.clear();location.href='index.html';}
(async()=>{await openDB(); load(); let q=await getQ(); if(q.length){totalFiles=q.length; document.getElementById('queue').classList.remove('hidden'); startParallel();}})();
lucide.createIcons();
</script>
</body>
</html>
