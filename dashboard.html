<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlimited Drive - Connected</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap'); body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc}.preview-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));display:grid;gap:16px}</style>
<script>if(localStorage.getItem('presensi_login')!=='true'){location.href='index.html'}</script>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="hard-drive"></i></div><div><h1 class="font-extrabold text-xl">Unlimited Drive</h1><p class="text-xs text-slate-500"><span id="user-nama">User</span> • <span id="file-count">0 file</span> • <span class="text-emerald-600 font-bold">● Terhubung</span></p></div></div>
<div class="flex gap-2"><input type="file" id="fileInput" multiple hidden><button onclick="document.getElementById('fileInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-lg"><i data-lucide="upload-cloud"></i> Upload Banyak</button><button onclick="logout()" class="bg-white border p-3 rounded-2xl"><i data-lucide="log-out"></i></button></div>
</div>
<div id="progress-wrap" class="max-w-7xl mx-auto mt-4 hidden"><div class="bg-slate-200 rounded-full h-3 overflow-hidden"><div id="progress-bar" class="bg-indigo-600 h-3 w-0 transition-all"></div></div><p id="progress-text" class="text-xs font-bold text-indigo-600 mt-1">Mengupload...</p></div>
</header>

<div class="max-w-7xl mx-auto p-4">
<div class="flex gap-3 mb-6"><div class="flex-1 relative"><i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-slate-400"></i><input id="search" oninput="filterFiles()" placeholder="Cari video, foto, apk, zip..." class="w-full pl-12 pr-4 py-3 rounded-2xl border bg-white outline-none focus:ring-2 focus:ring-indigo-500"></div><button onclick="loadFiles()" class="bg-white border px-5 py-3 rounded-2xl"><i data-lucide="refresh-cw"></i></button></div>
<div id="file-grid" class="preview-grid"></div>
<div id="empty" class="hidden py-24 text-center"><i data-lucide="inbox" class="w-16 h-16 mx-auto text-slate-300 mb-4"></i><p class="text-slate-500">Kosong. Upload 100 foto/video sekaligus sekarang!</p></div>
</div>

<!-- MODAL PREVIEW -->
<div id="preview-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
<div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden max-h- flex flex-col">
<div class="p-4 border-b flex justify-between items-center"><h3 id="preview-name" class="font-bold truncate"></h3><button onclick="closePreview()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x"></i></button></div>
<div id="preview-content" class="flex-1 bg-slate-50 flex items-center justify-center p-4 overflow-auto"></div>
<div class="p-4 border-t flex gap-3">
<a id="preview-download" href="#" target="_blank" class="flex-1 bg-indigo-600 text-white text-center py-3 rounded-xl font-bold flex items-center justify-center gap-2"><i data-lucide="download"></i> Download ke File Manager</a>
<button id="preview-delete" class="px-6 py-3 bg-rose-50 text-rose-600 rounded-xl font-bold">Hapus</button>
</div>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxL5BWM_1gIpiC2capsl-fR7ZN1wCoPNlTvbJ90j4ya8gPEYV_KO4rzOzAPndiLDg59PQ/exec";
let allFiles=[];
lucide.createIcons();
document.getElementById('user-nama').textContent=localStorage.getItem('presensi_nama')||'User';
const fileInput=document.getElementById('fileInput'); const grid=document.getElementById('file-grid');

async function loadFiles(){
 grid.innerHTML='<p class="col-span-full text-center py-10">Memuat...</p>';
 try{ const res=await fetch(API_URL); const data=await res.json(); allFiles=data.files||[]; document.getElementById('file-count').textContent=allFiles.length+' file'; renderFiles(allFiles); }catch(e){ grid.innerHTML='<p class="text-rose-500">Gagal load. Deploy ulang Web App jadi Anyone.</p>'; }
}
function renderFiles(files){
 grid.innerHTML=''; if(files.length===0){document.getElementById('empty').classList.remove('hidden'); return;} document.getElementById('empty').classList.add('hidden');
 files.forEach(f=>{ const isImage=f.mimeType.includes('image'); const isVideo=f.mimeType.includes('video'); const icon=isImage?'image':isVideo?'video':'file'; const card=document.createElement('div'); card.className='bg-white rounded-2xl border overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group'; card.innerHTML=`<div class="h-36 bg-slate-100 flex items-center justify-center overflow-hidden relative">${isImage?`<img src="${f.url}" class="w-full h-full object-cover">`:`<i data-lucide="${icon}" class="w-10 h-10 text-slate-400"></i>`}<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 flex items-center justify-center transition-all"><i data-lucide="eye" class="w-8 h-8 text-white opacity-0 group-hover:opacity-100"></i></div></div><div class="p-3"><p class="font-bold text-sm truncate">${f.name}</p><p class="text- text-slate-400">${(f.size/1024/1024).toFixed(2)} MB</p></div>`; card.onclick=()=>openPreview(f); grid.appendChild(card); }); lucide.createIcons();
}
fileInput.addEventListener('change', async(e)=>{
 const files=Array.from(e.target.files); if(!files.length) return;
 const wrap=document.getElementById('progress-wrap'); const bar=document.getElementById('progress-bar'); const txt=document.getElementById('progress-text'); wrap.classList.remove('hidden');
 const payload={files:[],filenames:[],mimetypes:[]};
 for(let i=0;i<files.length;i++){ txt.textContent=`Membaca ${i+1}/${files.length}: ${files[i].name}`; bar.style.width=((i/files.length)*50)+'%'; const b64=await toBase64(files[i]); payload.files.push(b64.split(',')[1]); payload.filenames.push(files[i].name); payload.mimetypes.push(files[i].type||'application/octet-stream'); }
 try{ txt.textContent='Upload ke Drive...'; bar.style.width='80%'; const form=new FormData(); payload.files.forEach((f,i)=>{ form.append('files',f); form.append('filenames',payload.filenames[i]); form.append('mimetypes',payload.mimetypes[i]); }); await fetch(API_URL,{method:'POST',body:form}); bar.style.width='100%'; txt.textContent='Berhasil!'; setTimeout(()=>{wrap.classList.add('hidden'); loadFiles();},1000);}catch(err){alert('Gagal: '+err); wrap.classList.add('hidden');}
});
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);});}
let activeFile=null;
function openPreview(f){activeFile=f; document.getElementById('preview-modal').classList.remove('hidden'); document.getElementById('preview-name').textContent=f.name; document.getElementById('preview-download').href=f.downloadUrl; document.getElementById('preview-delete').onclick=()=>deleteFile(f.id); const c=document.getElementById('preview-content'); if(f.mimeType.includes('image')) c.innerHTML=`<img src="${f.url}" class="max-w-full max-h- rounded-xl">`; else if(f.mimeType.includes('video')) c.innerHTML=`<video src="${f.url}" controls autoplay class="max-w-full max-h- rounded-xl"></video>`; else if(f.mimeType.includes('audio')) c.innerHTML=`<audio src="${f.url}" controls autoplay class="w-full"></audio>`; else if(f.mimeType.includes('pdf')) c.innerHTML=`<iframe src="${f.url}" class="w-full h-"></iframe>`; else c.innerHTML=`<div class="text-center"><i data-lucide="file" class="w-16 h-16 mx-auto text-slate-300 mb-4"></i><p>${f.name}</p></div>`; lucide.createIcons();}
function closePreview(){document.getElementById('preview-modal').classList.add('hidden');}
async function deleteFile(id){if(!confirm('Hapus?')) return; const form=new FormData(); form.append('action','delete'); form.append('id',id); await fetch(API_URL,{method:'POST',body:form}); closePreview(); loadFiles();}
function filterFiles(){const q=document.getElementById('search').value.toLowerCase(); renderFiles(allFiles.filter(f=>f.name.toLowerCase().includes(q)));}
function logout(){localStorage.clear(); location.href='index.html';}
loadFiles();
</script>
</body>
</html>
