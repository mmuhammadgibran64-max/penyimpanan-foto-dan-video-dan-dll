<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi & Login Masuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">
    <header class="w-full bg-white border-b border-slate-100 py-4 px-6 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-white/90">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-xl text-white shadow-md shadow-indigo-100"><i data-lucide="log-in" class="w-6 h-6"></i></div>
                <div><h1 class="text-lg font-bold text-slate-900 tracking-tight">Presensi Hub</h1><p class="text-xs text-slate-500 font-medium">Sistem Pencatatan Masuk Digital</p></div>
            </div>
            <div id="realtime-clock" class="text-right hidden sm:block">
                <p class="text-sm font-semibold text-slate-800" id="current-date">Memuat Tanggal...</p>
                <p class="text-xs text-indigo-600 font-mono font-bold" id="current-time">00:00:00 WIB</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-5 bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-xl shadow-slate-100/50">
            <div class="mb-6">
                <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold tracking-wide uppercase">Formulir Masuk</span>
                <h2 class="text-2xl font-bold text-slate-900 mt-2">Silakan Isi Presensi</h2>
                <p class="text-sm text-slate-500 mt-1">Isi presensi untuk masuk ke Dashboard Utama.</p>
            </div>
            <form id="attendance-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nama Lengkap</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i data-lucide="user" class="w-5 h-5"></i></div>
                        <input type="text" name="nama" id="nama" required placeholder="Masukkan nama lengkap Anda" class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nomor Handphone</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i data-lucide="phone" class="w-5 h-5"></i></div>
                        <input type="tel" name="nomorHp" id="nomorHp" required placeholder="Contoh: 081234567890" class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Waktu Masuk</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i data-lucide="clock" class="w-5 h-5"></i></div>
                        <input type="text" name="jamMasuk" id="jamMasuk" readonly class="block w-full pl-11 pr-12 py-3.5 bg-slate-100 border border-slate-200 rounded-2xl text-slate-600 font-mono font-medium focus:outline-none cursor-not-allowed text-sm">
                        <button type="button" id="sync-time-btn" class="absolute right-3 top-2.5 p-1 bg-white hover:bg-slate-50 rounded-lg text-slate-400 hover:text-indigo-600 transition-colors border border-slate-100"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all shadow-lg shadow-indigo-100">
                    <span id="btn-text">Kirim & Masuk Dashboard</span>
                    <span id="btn-loader" class="hidden"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></span>
                    <i data-lucide="arrow-right" id="btn-icon" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
        <div class="lg:col-span-7 space-y-6">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                <div class="relative z-10"><h3 class="text-xl font-bold mb-2">Akses Aman ke Dashboard</h3><p class="text-sm text-indigo-100 leading-relaxed">Setelah presensi, kamu akan diarahkan otomatis ke <b>Unlimited Drive Dashboard</b> yang ada di file terpisah.</p></div>
            </div>
        </div>
    </main>

    <div id="status-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"><div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl"><div id="modal-icon-container" class="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-emerald-50 text-emerald-600"><i data-lucide="check-circle" class="w-10 h-10"></i></div><h4 id="modal-title" class="text-xl font-bold text-slate-900 text-center"></h4><p id="modal-message" class="text-slate-500 text-sm text-center mt-2"></p><button id="modal-close" class="w-full mt-6 bg-slate-900 text-white font-semibold py-3 px-4 rounded-xl">Lanjut ke Dashboard</button></div></div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw6ll7Xr7TCOZcN5y0wkjlikPDwXtwWaDlHC08BtJOzQWHZRiWaxuDS8tkt16jtzfxi/exec';
        const form = document.getElementById('attendance-form');
        const inputJamMasuk = document.getElementById('jamMasuk');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const btnIcon = document.getElementById('btn-icon');
        const statusModal = document.getElementById('status-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalClose = document.getElementById('modal-close');

        // Cek jika sudah login, langsung lempar ke dashboard.html
        if(localStorage.getItem('presensi_login') === 'true'){
            window.location.href = 'dashboard.html';
        }

        function updateClock(){
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('id-ID') + ' WIB';
            document.getElementById('current-date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
            inputJamMasuk.value = `${dateStr} ${timeStr}`;
        }
        setInterval(updateClock, 1000); updateClock();
        lucide.createIcons();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true; btnText.textContent = "Mengirim..."; btnLoader.classList.remove('hidden'); btnIcon.classList.add('hidden');
            const namaValue = document.getElementById('nama').value.trim();
            const nomorHpValue = document.getElementById('nomorHp').value.trim();
            const jamMasukValue = inputJamMasuk.value;
            const formData = new URLSearchParams();
            formData.append('nama', namaValue); formData.append('nomorHp', nomorHpValue); formData.append('jamMasuk', jamMasukValue);
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });

                // SIMPAN SESSION LOGIN
                localStorage.setItem('presensi_login', 'true');
                localStorage.setItem('presensi_nama', namaValue);
                localStorage.setItem('presensi_hp', nomorHpValue);
                localStorage.setItem('presensi_jam', jamMasukValue);

                statusModal.classList.remove('hidden');
                modalTitle.innerHTML = "Presensi Berhasil!";
                modalMessage.innerHTML = `Halo <b>${namaValue}</b>, kamu akan diarahkan ke Dashboard Utama.`;
                lucide.createIcons();
            } catch (error) {
                alert("Gagal kirim, cek koneksi internet.");
                submitBtn.disabled = false; btnText.textContent = "Kirim & Masuk Dashboard"; btnLoader.classList.add('hidden'); btnIcon.classList.remove('hidden');
            }
        });

        modalClose.addEventListener('click', () => {
            window.location.href = 'dashboard.html'; // INI KUNCI FILE TERPISAH
        });
    </script>
</body>
</html>
